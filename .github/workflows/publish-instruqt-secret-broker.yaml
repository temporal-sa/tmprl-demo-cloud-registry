name: Publish Instruqt secret broker

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/instruqt-secret-broker/**
      - .github/workflows/publish-instruqt-secret-broker.yaml

permissions:
  contents: read
  id-token: write

concurrency:
  group: instruqt-secret-broker-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::429214323166:role/tmprl-dem-cld-instruqt-secret-broker-github-actions
  APP_DIR: apps/instruqt-secret-broker
  PUBLIC_ECR_URI: public.ecr.aws/s1u1b8l5/tmprl-dem-cld/instruqt-secret-broker
  ARTIFACT_BUCKET: tmprl-dem-cld-secret-broker-429214323166-us-west-1
  ARTIFACT_PREFIX: secret-broker
  KMS_SIGNING_KEY_ID: alias/tmprl-dem-cld-instruqt-secret-broker-signing
  SIGNING_KEY_SHA256: cf0310e7827f2b444a876b06768e8e11bef5b2ad9d5f58f93e45c27674b2b594

jobs:
  publish:
    name: Test, build, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.APP_DIR }}/go.mod
          cache-dependency-path: ${{ env.APP_DIR }}/go.mod

      - name: Test
        working-directory: ${{ env.APP_DIR }}
        run: |
          go test ./...
          go vet ./...

      - name: Set artifact version
        id: artifact
        shell: bash
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          timestamp="$(date -u +'%Y%m%d%H%M%S')"
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "version=main-${timestamp}-${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "build_date=${build_date}" >> "${GITHUB_OUTPUT}"

      - name: Build Linux CLI binaries
        working-directory: ${{ env.APP_DIR }}
        env:
          VERSION: ${{ steps.artifact.outputs.version }}
          BUILD_DATE: ${{ steps.artifact.outputs.build_date }}
        shell: bash
        run: |
          mkdir -p dist
          ldflags="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA} -X main.buildDate=${BUILD_DATE}"
          for architecture in amd64 arm64; do
            output="dist/secret-broker-linux-${architecture}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${architecture}" \
              go build -trimpath -ldflags "${ldflags}" -o "${output}" .
            chmod 0755 "${output}"
            (
              cd dist
              sha256sum "secret-broker-linux-${architecture}" \
                > "secret-broker-linux-${architecture}.sha256"
            )
          done
          cp install.sh dist/install.sh
          (
            cd dist
            sha256sum secret-broker-linux-amd64 secret-broker-linux-arm64 > checksums.txt
          )

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sign CLI binaries
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          aws kms get-public-key \
            --region us-west-1 \
            --key-id "${KMS_SIGNING_KEY_ID}" \
            --query PublicKey \
            --output text \
            | base64 --decode > dist/signing-key.der
          openssl pkey \
            -pubin \
            -inform DER \
            -in dist/signing-key.der \
            -out dist/signing-key.pem
          rm dist/signing-key.der

          actual_key_sha256="$(
            openssl pkey -pubin -in dist/signing-key.pem -outform DER \
              | sha256sum \
              | awk '{print $1}'
          )"
          if [ "${actual_key_sha256}" != "${SIGNING_KEY_SHA256}" ]; then
            echo "Signing public key fingerprint mismatch" >&2
            exit 1
          fi
          printf '%s\n' "${actual_key_sha256}" > dist/signing-key.spki.sha256

          for architecture in amd64 arm64; do
            binary="dist/secret-broker-linux-${architecture}"
            digest="${binary}.digest"
            signature="${binary}.sig"

            openssl dgst -sha256 -binary "${binary}" > "${digest}"
            aws kms sign \
              --region us-west-1 \
              --key-id "${KMS_SIGNING_KEY_ID}" \
              --message "fileb://${PWD}/${digest}" \
              --message-type DIGEST \
              --signing-algorithm RSASSA_PSS_SHA_256 \
              --query Signature \
              --output text \
              | base64 --decode > "${signature}"
            rm "${digest}"

            openssl dgst -sha256 \
              -verify dist/signing-key.pem \
              -signature "${signature}" \
              -sigopt rsa_padding_mode:pss \
              -sigopt rsa_pss_saltlen:32 \
              "${binary}"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: secret-broker-${{ steps.artifact.outputs.version }}
          path: ${{ env.APP_DIR }}/dist/
          if-no-files-found: error

      - name: Publish signed CLI release
        working-directory: ${{ env.APP_DIR }}
        env:
          VERSION: ${{ steps.artifact.outputs.version }}
        shell: bash
        run: |
          aws s3 cp dist/signing-key.pem \
            "s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/trust/v1/signing-key.pem" \
            --region us-west-1 \
            --cache-control "public,max-age=31536000,immutable" \
            --content-type "application/x-pem-file"
          aws s3 cp dist/signing-key.spki.sha256 \
            "s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/trust/v1/signing-key.spki.sha256" \
            --region us-west-1 \
            --cache-control "public,max-age=31536000,immutable" \
            --content-type "text/plain"
          aws s3 sync dist/ \
            "s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/${VERSION}/" \
            --region us-west-1 \
            --cache-control "public,max-age=31536000,immutable"

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push multi-platform artifact image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.APP_DIR }}
          file: ${{ env.APP_DIR }}/Dockerfile
          target: artifact
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.PUBLIC_ECR_URI }}:main
            ${{ env.PUBLIC_ECR_URI }}:${{ steps.artifact.outputs.version }}
          build-args: |
            VERSION=${{ steps.artifact.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.artifact.outputs.build_date }}
            SIGNING_KEY_SHA256=${{ env.SIGNING_KEY_SHA256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Promote CLI downloads
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          aws s3 sync dist/ \
            "s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/main/" \
            --region us-west-1 \
            --cache-control "no-cache"
