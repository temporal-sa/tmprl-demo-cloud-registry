name: Publish Instruqt secret broker

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/instruqt-secret-broker/**
      - .github/workflows/publish-instruqt-secret-broker.yaml

permissions:
  contents: read
  id-token: write

concurrency:
  group: instruqt-secret-broker-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::429214323166:role/tmprl-dem-cld-instruqt-secret-broker-github-actions
  APP_DIR: apps/instruqt-secret-broker
  PUBLIC_ECR_URI: public.ecr.aws/s1u1b8l5/tmprl-dem-cld/instruqt-secret-broker
  ARTIFACT_BUCKET: tmprl-dem-cld-secret-broker-429214323166-us-west-1
  ARTIFACT_PREFIX: secret-broker

jobs:
  publish:
    name: Test, build, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.APP_DIR }}/go.mod
          cache-dependency-path: ${{ env.APP_DIR }}/go.mod

      - name: Test
        working-directory: ${{ env.APP_DIR }}
        run: |
          go test ./...
          go vet ./...

      - name: Set artifact version
        id: artifact
        shell: bash
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          timestamp="$(date -u +'%Y%m%d%H%M%S')"
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "version=main-${timestamp}-${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "build_date=${build_date}" >> "${GITHUB_OUTPUT}"

      - name: Build Linux CLI binaries
        working-directory: ${{ env.APP_DIR }}
        env:
          VERSION: ${{ steps.artifact.outputs.version }}
          BUILD_DATE: ${{ steps.artifact.outputs.build_date }}
        shell: bash
        run: |
          mkdir -p dist
          ldflags="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA} -X main.buildDate=${BUILD_DATE}"
          for architecture in amd64 arm64; do
            output="dist/secret-broker-linux-${architecture}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${architecture}" \
              go build -trimpath -ldflags "${ldflags}" -o "${output}" .
            chmod 0755 "${output}"
            (
              cd dist
              sha256sum "secret-broker-linux-${architecture}" \
                > "secret-broker-linux-${architecture}.sha256"
            )
          done
          cp install.sh dist/install.sh
          (
            cd dist
            sha256sum secret-broker-linux-amd64 secret-broker-linux-arm64 > checksums.txt
          )

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: secret-broker-${{ steps.artifact.outputs.version }}
          path: ${{ env.APP_DIR }}/dist/
          if-no-files-found: error

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push multi-platform artifact image
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.APP_DIR }}
          file: ${{ env.APP_DIR }}/Dockerfile
          target: artifact
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.PUBLIC_ECR_URI }}:main
            ${{ env.PUBLIC_ECR_URI }}:${{ steps.artifact.outputs.version }}
          build-args: |
            VERSION=${{ steps.artifact.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.artifact.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish CLI downloads
        working-directory: ${{ env.APP_DIR }}
        env:
          VERSION: ${{ steps.artifact.outputs.version }}
        shell: bash
        run: |
          aws s3 sync dist/ \
            "s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/${VERSION}/" \
            --region us-west-1 \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync dist/ \
            "s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/main/" \
            --region us-west-1 \
            --cache-control "no-cache"
