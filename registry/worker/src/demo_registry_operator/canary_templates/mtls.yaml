# Operator-canary project template: Temporal mTLS auth.
# Self-contained: auth.mode=mtls plus the worker's cert-file mount + the env-var
# names the banking app actually reads (TEMPORAL_CERT_PATH / TEMPORAL_KEY_PATH).
# Without the pathEnv remap the operator only emits TEMPORAL_MTLS_CLIENT_{CERT,KEY}_PATH,
# which the app ignores -> it falls through to no-auth and the worker can't connect.
name: mtls
authMode: mtls
demoProjectTemplate:
  apiVersion: registry.tmprl-demo.cloud/v1alpha1
  kind: DemoProject
  metadata:
    name: operator-canary-template
  spec:
    temporal:
      auth:
        mode: mtls
    builds:
      backend:
        context: .
        dockerfile: docker/backend.Dockerfile
      frontend:
        context: .
        dockerfile: docker/frontend.Dockerfile
      worker:
        context: .
        dockerfile: docker/worker-python.Dockerfile
    components:
      backend:
        build: backend
        ports:
          - containerPort: 8000
            servicePort: 8000
        temporalAccess: true
      frontend:
        build: frontend
        ports:
          - containerPort: 5173
            servicePort: 80
      worker:
        build: worker
        env:
          - name: BANKING_BACKEND_URL
            value: http://backend:8000
        worker: true
        temporalAccess: true
        temporalMtls:
          certFiles:
            mountPath: /var/run/secrets/tmprl-demo.cloud/temporal
            pathEnv:
              clientCert: TEMPORAL_CERT_PATH
              clientKey: TEMPORAL_KEY_PATH
    ingress:
      subdomain: operator-canary
      temporalAuthRequired: false
    smokeCheck:
      expectedStatus: 200
      path: /api/health
    source:
      repo: https://github.com/temporal-sa/demo-banking-app-money-transfer
