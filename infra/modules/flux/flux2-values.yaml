# Helm values for the fluxcd-community/flux2 chart.
#
# Consumed by OpenTofu via a helm_release (translate into the release
# `values`/`set`); this is NOT a Flux HelmRelease. Flux itself is installed by
# Tofu, then Flux reconciles everything else in the repo.
#
# Chart:      fluxcd-community/flux2
# Version:    2.19.0            (PIN EXACTLY — do not use a range)
# appVersion: Flux 2.9.1
# Cluster:    tmprl-dem-cld-blue (account 429214323166, us-west-1, k8s 1.36)
#
# Doctrine: fresh stack is the upgrade vehicle — latest-GA, not pet-parity.
#
# --------------------------------------------------------------------------
# Controller topology
# --------------------------------------------------------------------------
# In chart 2.19.0 the following are ON by default and are intentionally left
# at their defaults (create: true):
#   - sourceController        (source.toolkit.fluxcd.io/v1)
#   - kustomizeController      (kustomize.toolkit.fluxcd.io/v1)
#   - helmController           (helm.toolkit.fluxcd.io/v2)
#   - notificationController
#
# Broker image promotion is performed by GitHub Actions, which commits an image
# digest to the deployment manifest. No resources use Flux image automation, so
# leave both optional controllers disabled.
#
# Everything else (watchAllNamespaces: true, installCRDs: true, RBAC + view/
# edit/admin aggregation, cluster-admin roleRef, per-controller resource
# requests, sourceWatcher.create: false, crds.migration.enabled: false) is left
# at chart defaults, matching the pet's `flux install` topology.

# image-reflector-controller
imageReflectionController:
  create: false

# image-automation-controller
imageAutomationController:
  create: false
