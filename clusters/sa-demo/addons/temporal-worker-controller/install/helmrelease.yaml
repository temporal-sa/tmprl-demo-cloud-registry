apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: temporal-worker-controller-crds
  namespace: tmprl-dem-cld-worker-controller
spec:
  chart:
    spec:
      chart: temporal-worker-controller-crds
      sourceRef:
        kind: HelmRepository
        name: temporal-worker-controller
        namespace: flux-system
      version: 0.26.0
  interval: 30m
  releaseName: temporal-worker-controller-crds
  targetNamespace: tmprl-dem-cld-worker-controller
  driftDetection:
    mode: enabled
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: temporal-worker-controller
  namespace: tmprl-dem-cld-worker-controller
spec:
  chart:
    spec:
      chart: temporal-worker-controller
      sourceRef:
        kind: HelmRepository
        name: temporal-worker-controller
        namespace: flux-system
      version: 0.26.0
  dependsOn:
    - name: temporal-worker-controller-crds
  interval: 30m
  releaseName: temporal-worker-controller
  targetNamespace: tmprl-dem-cld-worker-controller
  values:
    certmanager:
      enabled: true
      install: true
    namespace:
      create: false
    # Chart 0.26.0 installs this optional WorkerDeployment webhook when enabled,
    # but the v1.7.0 manager only registers the WorkerResourceTemplate webhook
    # path. Leave the optional webhook off so WorkerDeployment admission uses
    # the CRD schema instead of a 404ing webhook endpoint.
    webhook:
      enabled: false
