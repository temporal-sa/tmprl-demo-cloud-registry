apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - external-secrets.yaml
  - configmaps.yaml
  - redis.yaml
  - litellm.yaml
  - broker.yaml
  - hpa.yaml
  - certificate.yaml
  - ingressroute.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: instruqt-litellm-tracks
    namespace: tmprl-dem-cld-instruqt-litellm
    files:
      - tracks.yaml=tracks.yaml
    options:
      labels:
        app.kubernetes.io/name: instruqt-litellm
        app.kubernetes.io/component: broker
