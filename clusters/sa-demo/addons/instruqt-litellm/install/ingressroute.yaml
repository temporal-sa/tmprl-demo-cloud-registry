apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: instruqt-litellm
  namespace: tmprl-dem-cld-instruqt-litellm
  labels:
    app.kubernetes.io/name: instruqt-litellm
    app.kubernetes.io/component: ingress
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`litellm-instruqt.tmprl-demo.cloud`) && !PathPrefix(`/ui`)
      services:
        - name: instruqt-litellm
          namespace: tmprl-dem-cld-instruqt-litellm
          passHostHeader: true
          port: 4000
    - kind: Rule
      match: Host(`litellm-broker-instruqt.tmprl-demo.cloud`)
      services:
        - name: instruqt-litellm-broker
          namespace: tmprl-dem-cld-instruqt-litellm
          passHostHeader: true
          port: 80
  tls:
    secretName: instruqt-litellm-tls
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: instruqt-litellm-http
  namespace: tmprl-dem-cld-instruqt-litellm
  labels:
    app.kubernetes.io/name: instruqt-litellm
    app.kubernetes.io/component: ingress
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`litellm-instruqt.tmprl-demo.cloud`) && !PathPrefix(`/ui`) && !PathPrefix(`/fallback`)
      services:
        - name: instruqt-litellm
          namespace: tmprl-dem-cld-instruqt-litellm
          passHostHeader: true
          port: 4000
    - kind: Rule
      match: Host(`litellm-broker-instruqt.tmprl-demo.cloud`)
      services:
        - name: instruqt-litellm-broker
          namespace: tmprl-dem-cld-instruqt-litellm
          passHostHeader: true
          port: 80
