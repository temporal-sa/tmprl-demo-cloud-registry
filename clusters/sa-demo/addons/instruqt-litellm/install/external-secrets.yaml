apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: instruqt-litellm-runtime
  namespace: tmprl-dem-cld-instruqt-litellm
  labels:
    app.kubernetes.io/name: instruqt-litellm
    app.kubernetes.io/component: litellm
  annotations:
    platform.temporal.io/secret-source: tmprl-dem-cld/platform/instruqt-litellm/runtime
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: instruqt-litellm-secrets
    creationPolicy: Merge
  dataFrom:
    - extract:
        key: tmprl-dem-cld/platform/instruqt-litellm/runtime
    - extract:
        key: tmprl-dem-cld/platform/instruqt-litellm/provider/anthropic
    - extract:
        key: tmprl-dem-cld/platform/instruqt-litellm/provider/openai
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: instruqt-litellm-broker
  namespace: tmprl-dem-cld-instruqt-litellm
  labels:
    app.kubernetes.io/name: instruqt-litellm
    app.kubernetes.io/component: broker
  annotations:
    platform.temporal.io/secret-source: tmprl-dem-cld/platform/instruqt-litellm/broker
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: instruqt-litellm-broker-secrets
    creationPolicy: Merge
  dataFrom:
    - extract:
        key: tmprl-dem-cld/platform/instruqt-litellm/broker
