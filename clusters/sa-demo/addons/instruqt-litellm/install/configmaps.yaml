apiVersion: v1
kind: ConfigMap
metadata:
  name: instruqt-litellm-config
  namespace: tmprl-dem-cld-instruqt-litellm
  labels:
    app.kubernetes.io/name: instruqt-litellm
    app.kubernetes.io/component: litellm
data:
  config.yaml: |
    model_list:
      - model_name: anthropic/*
        litellm_params:
          model: anthropic/*
          api_key: os.environ/ANTHROPIC_API_KEY
      - model_name: openai/*
        litellm_params:
          model: openai/*
          api_key: os.environ/OPENAI_API_KEY
      - model_name: gpt-4o
        litellm_params:
          model: openai/gpt-4o
          api_key: os.environ/OPENAI_API_KEY
      - model_name: gpt-3.5-turbo
        litellm_params:
          model: openai/gpt-3.5-turbo
          api_key: os.environ/OPENAI_API_KEY

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      disable_master_key_return: true

    router_settings:
      routing_strategy: simple-shuffle
      redis_host: instruqt-litellm-redis.tmprl-dem-cld-instruqt-litellm.svc.cluster.local
      redis_port: 6379
      cache_params:
        type: redis
        max_connections: 1000

    litellm_settings:
      drop_params: true
      request_timeout: 120
      upperbound_key_generate_params:
        max_budget: 25
        duration: 2d
        rpm_limit: 120
        tpm_limit: 400000
        max_parallel_requests: 8
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: instruqt-litellm-tracks
  namespace: tmprl-dem-cld-instruqt-litellm
  labels:
    app.kubernetes.io/name: instruqt-litellm
    app.kubernetes.io/component: broker
data:
  tracks.yaml: |
    tracks:
      agent-harness-anthropic-gateway:
        enabled: true
        description: "Anthropic and OpenAI-compatible local-mode Agent Harness demo track."
        models:
          - anthropic/*
          - openai/*
        default_model: anthropic/claude-sonnet-4-5
        duration: 1d
        max_budget: 5.0
        rpm_limit: 60
        tpm_limit: 200000
        max_parallel_requests: 4
        path_budget:
          team_id: instruqt-agent-harness-anthropic-gateway
          team_alias: Agent Harness Anthropic Gateway
          max_budget: 100.0
          rpm_limit: 1200
          tpm_limit: 4000000
        key_alias_prefix: instruqt-agent-harness-anthropic
        metadata:
          owner: agent-harness-demo
          gateway: anthropic-openai

      agent-harness-local:
        enabled: true
        description: "Default local-mode Agent Harness track."
        models:
          - anthropic/*
          - openai/*
        default_model: anthropic/claude-sonnet-4-5
        duration: 2h
        max_budget: 5.0
        rpm_limit: 60
        tpm_limit: 200000
        max_parallel_requests: 4
        path_budget:
          team_id: instruqt-agent-harness-local
          team_alias: Agent Harness Local
          max_budget: 500.0
          budget_duration: 30d
          rpm_limit: 1200
          tpm_limit: 4000000
        key_alias_prefix: instruqt-agent-harness
        metadata:
          owner: agent-harness-demo

      testing-temporal-python-ai-agents-v2:
        enabled: true
        description: "Testing track for the Python AI Agents workshop."
        models:
          - gpt-4o
          - gpt-3.5-turbo
        default_model: openai/gpt-4o
        duration: 2d
        max_budget: 20.0
        rpm_limit: 60
        tpm_limit: 200000
        max_parallel_requests: 4
        key_alias_prefix: instruqt-testing-python-ai-agents
        metadata:
          owner: ai-agents-workshop
          gateway: openai
          testing: true
