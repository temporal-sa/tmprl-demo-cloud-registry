apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      version: 23.0.1
  interval: 30m
  releaseName: traefik
  storageNamespace: traefik
  targetNamespace: traefik
  values:
    deployment:
      replicas: 1
    ingressClass:
      enabled: true
      isDefaultClass: true
    ingressRoute:
      dashboard:
        enabled: true
    logs:
      general:
        level: DEBUG
    providers:
      kubernetesCRD:
        allowExternalNameServices: true
        enabled: true
    serviceAccountAnnotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::429214323166:role/traefik-ingress-role
      eks.amazonaws.com/sts-regional-endpoints: "true"
