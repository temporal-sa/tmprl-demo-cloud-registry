apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      version: 23.0.1
  interval: 30m
  releaseName: traefik
  storageNamespace: traefik
  targetNamespace: traefik
  values:
    autoscaling:
      behavior:
        scaleDown:
          policies:
            - periodSeconds: 60
              type: Pods
              value: 1
          stabilizationWindowSeconds: 300
        scaleUp:
          policies:
            - periodSeconds: 60
              type: Pods
              value: 2
          stabilizationWindowSeconds: 60
      enabled: true
      maxReplicas: 6
      metrics:
        - resource:
            name: cpu
            target:
              averageUtilization: 60
              type: Utilization
          type: Resource
        - resource:
            name: memory
            target:
              averageUtilization: 70
              type: Utilization
          type: Resource
      minReplicas: 2
    deployment:
      replicas: 2
    ingressClass:
      enabled: true
      isDefaultClass: true
    ingressRoute:
      dashboard:
        enabled: true
    logs:
      general:
        level: DEBUG
    providers:
      kubernetesCRD:
        allowExternalNameServices: true
        enabled: true
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    serviceAccountAnnotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::429214323166:role/traefik-ingress-role
      eks.amazonaws.com/sts-regional-endpoints: "true"
    topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/instance: traefik-traefik
            app.kubernetes.io/name: traefik
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
      - labelSelector:
          matchLabels:
            app.kubernetes.io/instance: traefik-traefik
            app.kubernetes.io/name: traefik
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
