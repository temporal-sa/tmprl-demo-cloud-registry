# sa-demo is now a user-accessible MANUAL / self-serve cluster (P7). The managed
# demo systems (registry CRDs + operator + the projects/instruqt catalogs + the
# instruqt-litellm app layer) moved to the Tofu-managed "blue" cluster and were
# removed here, so this tree carries only the base platform users need to deploy
# their own workloads by hand: ingress (traefik), external-secrets, autoscaling,
# metrics, node-local-dns, and the temporal-worker-controller. sa-demo keeps the
# `*.tmprl-demo.cloud` wildcard as the manual catch-all; managed demos ride the
# per-demo `<demo> -> live -> blue` records that override it.
#
# Do NOT re-add a registry-operator / registry-projects / registry-self layer here:
# a second operator on this cluster would race blue's on the shared per-demo
# Temporal Cloud namespaces (the P7 concurrency hazard).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  path: ./clusters/sa-demo/flux-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: node-local-dns
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/sa-demo/addons/node-local-dns/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: node-local-dns
      namespace: kube-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/sa-demo/addons/metrics-server/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: metrics-server
      namespace: kube-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-autoscaler
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/sa-demo/addons/cluster-autoscaler/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cluster-autoscaler
      namespace: kube-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-install
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/sa-demo/addons/external-secrets/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-stores
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets-install
  interval: 5m
  path: ./clusters/sa-demo/addons/external-secrets/stores
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: temporal-worker-controller
  namespace: flux-system
spec:
  dependsOn:
    - name: node-local-dns
  interval: 5m
  path: ./clusters/sa-demo/addons/temporal-worker-controller/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 10m
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: temporal-worker-controller-crds
      namespace: tmprl-dem-cld-worker-controller
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: temporal-worker-controller
      namespace: tmprl-dem-cld-worker-controller
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/sa-demo/addons/traefik/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: traefik
      namespace: traefik
