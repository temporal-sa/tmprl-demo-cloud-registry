apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-worker-temporal
  namespace: demo-registry-system
  labels:
    app.kubernetes.io/name: demo-registry-operator
  annotations:
    platform.temporal.io/secret-source: tmprl-cloud-demo/platform/registry-worker-temporal
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: registry-worker-temporal
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: tmprl-cloud-demo/platform/registry-worker-temporal
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: temporal-cloud-bootstrap
  namespace: demo-registry-system
  labels:
    app.kubernetes.io/name: demo-registry-operator
  annotations:
    platform.temporal.io/secret-source: tmprl-cloud-demo/platform/temporal-cloud-bootstrap
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: platform-secrets
    kind: ClusterSecretStore
  target:
    name: temporal-cloud-bootstrap
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: tmprl-cloud-demo/platform/temporal-cloud-bootstrap
