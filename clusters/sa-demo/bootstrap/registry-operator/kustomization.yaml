apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tmprl-dem-cld-registry-operator
resources:
  - namespace.yaml
  - rbac.yaml
  - external-secrets.yaml
  - deployment.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: registry-operator-common-config
    literals:
      - DEMO_REGISTRY_TASK_QUEUE=registry-management
      - DEMO_REGISTRY_EXTERNAL_RESOURCE_MODE=aws
      - DEMO_REGISTRY_TEMPORAL_CLOUD_MODE=cloud-api
      - DEMO_REGISTRY_BUILD_MODE=aws-codebuild
      - DEMO_REGISTRY_CODEBUILD_PROJECT=tmprl-dem-cld-build
      - DEMO_REGISTRY_CODEBUILD_POLL_SECONDS=30
      - DEMO_REGISTRY_CODEBUILD_TIMEOUT_MINUTES=30
      - DEMO_REGISTRY_AWS_REGION=us-west-1
      - DEMO_REGISTRY_AWS_ACCOUNT_ID=429214323166
      - DEMO_REGISTRY_TEMPORAL_CLOUD_ACCOUNT_ID=a2dd6
      - DEMO_REGISTRY_TEMPORAL_CLOUD_REGION=gcp-us-central1
      - DEMO_REGISTRY_READINESS_TIMEOUT_SECONDS=300
      - DEMO_REGISTRY_READINESS_POLL_SECONDS=5
      - DEMO_REGISTRY_CATALOG_STATUS_NAMESPACE=tmprl-dem-cld-registry-operator
      - DEMO_REGISTRY_CATALOG_STATUS_CONFIGMAP=registry-catalog-status
      - DEMO_REGISTRY_CATALOG_STATUS_MIRROR_NAMESPACE=tmprl-dem-cld-registry-operator
      - DEMO_REGISTRY_SOURCE_WATCH_NAMESPACE=tmprl-dem-cld-registry-operator
      - DEMO_REGISTRY_SOURCE_WATCH_INTERVAL=1m
      - DEMO_REGISTRY_ACTIVITY_WORKERS=20
  - name: registry-operator-watch-config
    literals:
      - DEMO_REGISTRY_WORKER_ENABLED=false
      - DEMO_REGISTRY_WATCH_ENABLED=true
      - DEMO_REGISTRY_WATCH_MODE=bootstrap
      - DEMO_REGISTRY_WATCH_HANDOFF_DEPLOYMENT=tmprl-dem-cld-registry-operator/registry-operator
      - DEMO_REGISTRY_WATCH_INTERVAL_SECONDS=15
