apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-registry-operator
  namespace: demo-registry-system
  labels:
    app.kubernetes.io/name: demo-registry-operator
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/tmprl-demo-registry-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: demo-registry-operator
  labels:
    app.kubernetes.io/name: demo-registry-operator
rules:
  - apiGroups:
      - registry.tmprl-demo.cloud
    resources:
      - demoprojects
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - registry.tmprl-demo.cloud
    resources:
      - demoprojects/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - configmaps
      - serviceaccounts
      - services
    verbs:
      - get
      - create
      - patch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - create
      - patch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    verbs:
      - get
      - create
      - patch
  - apiGroups:
      - external-secrets.io
    resources:
      - externalsecrets
    verbs:
      - get
      - create
      - patch
  - apiGroups:
      - traefik.io
    resources:
      - ingressroutes
      - middlewares
    verbs:
      - get
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: demo-registry-operator
  labels:
    app.kubernetes.io/name: demo-registry-operator
subjects:
  - kind: ServiceAccount
    name: demo-registry-operator
    namespace: demo-registry-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: demo-registry-operator
