apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-registry-operator
  namespace: demo-registry-system
  labels:
    app.kubernetes.io/name: demo-registry-operator
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-registry-operator
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-registry-operator
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: demo-registry-operator
      containers:
        - name: worker
          image: registry.invalid/tmprl-cloud-demo/demo-registry/worker:bootstrap
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: registry-worker-temporal
            - secretRef:
                name: temporal-cloud-bootstrap
          env:
            - name: DEMO_REGISTRY_TASK_QUEUE
              value: demo-registry-management
            - name: DEMO_REGISTRY_WATCH_ENABLED
              value: "true"
            - name: DEMO_REGISTRY_WATCH_INTERVAL_SECONDS
              value: "15"
            - name: DEMO_REGISTRY_RECONCILE_MODE
              value: apply
            - name: DEMO_REGISTRY_EXTERNAL_RESOURCE_MODE
              value: plan
            - name: DEMO_REGISTRY_BUILD_MODE
              value: plan
            - name: DEMO_REGISTRY_READINESS_TIMEOUT_SECONDS
              value: "300"
            - name: DEMO_REGISTRY_READINESS_POLL_SECONDS
              value: "5"
            - name: DEMO_REGISTRY_ACTIVITY_WORKERS
              value: "20"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
