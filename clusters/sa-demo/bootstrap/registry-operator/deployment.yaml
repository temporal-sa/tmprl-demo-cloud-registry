apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-operator-watch
  namespace: tmprl-dem-cld-registry-operator
  labels:
    app.kubernetes.io/name: registry-operator
    app.kubernetes.io/component: watch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry-operator
      app.kubernetes.io/component: watch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-operator
        app.kubernetes.io/component: watch
    spec:
      serviceAccountName: registry-operator
      containers:
        - name: watch
          image: 429214323166.dkr.ecr.us-west-1.amazonaws.com/tmprl-dem-cld/registry-operator/worker:git-c44b36380890
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: registry-operator-common-config
            - configMapRef:
                name: registry-operator-watch-config
            - secretRef:
                name: registry-worker-temporal
            - secretRef:
                name: temporal-cloud-bootstrap
            - secretRef:
                name: instruqt-cli
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
