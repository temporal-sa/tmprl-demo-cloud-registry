apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-registry-operator
  namespace: demo-registry-system
  labels:
    app.kubernetes.io/name: demo-registry-operator
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-registry-operator
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-registry-operator
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: demo-registry-operator
      containers:
        - name: worker
          image: registry.invalid/tmprl-cloud-demo/demo-registry/worker:bootstrap
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: demo-registry-operator-config
            - secretRef:
                name: registry-worker-temporal
            - secretRef:
                name: temporal-cloud-bootstrap
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
