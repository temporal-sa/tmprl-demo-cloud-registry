apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: instruqtcourses.registry.tmprl-demo.cloud
  labels:
    app.kubernetes.io/name: registry-operator
    app.kubernetes.io/managed-by: flux
spec:
  group: registry.tmprl-demo.cloud
  scope: Cluster
  names:
    plural: instruqtcourses
    singular: instruqtcourse
    kind: InstruqtCourse
    listKind: InstruqtCourseList
    shortNames:
      - course
      - courses
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Track
          type: string
          jsonPath: .status.track.slug
        - name: Source
          type: string
          jsonPath: .status.source.revision
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - source
                - track
              properties:
                source:
                  type: object
                  required:
                    - repo
                  properties:
                    repo:
                      type: string
                      pattern: "^https://github\\.com/temporal-sa/[A-Za-z0-9_.-]+/?$"
                    branch:
                      type: string
                      minLength: 1
                    testingBranch:
                      type: string
                      minLength: 1
                    path:
                      type: string
                      minLength: 1
                    gitRepository:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    interval:
                      type: string
                      minLength: 1
                    watch:
                      type: boolean
                content:
                  type: object
                  required:
                    - repo
                  properties:
                    repo:
                      type: string
                      pattern: "^https://github\\.com/temporal-sa/[A-Za-z0-9_.-]+/?$"
                    branch:
                      type: string
                      minLength: 1
                    testingBranch:
                      type: string
                      minLength: 1
                    path:
                      type: string
                      minLength: 1
                    gitRepository:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    interval:
                      type: string
                      minLength: 1
                    watch:
                      type: boolean
                images:
                  type: object
                  additionalProperties:
                    type: object
                    required:
                      - container
                      - context
                      - dockerfile
                    properties:
                      container:
                        type: string
                        minLength: 1
                      context:
                        type: object
                        required:
                          - source
                          - path
                        properties:
                          source:
                            type: string
                            enum:
                              - source
                              - content
                          path:
                            type: string
                            minLength: 1
                      dockerfile:
                        type: object
                        required:
                          - source
                          - path
                        properties:
                          source:
                            type: string
                            enum:
                              - source
                              - content
                          path:
                            type: string
                            minLength: 1
                      platform:
                        type: string
                        minLength: 1
                      target:
                        type: string
                        minLength: 1
                      buildArgs:
                        type: object
                        additionalProperties:
                          type: string
                track:
                  type: object
                  required:
                    - organization
                    - slug
                  properties:
                    organization:
                      type: string
                      minLength: 1
                    slug:
                      type: string
                      minLength: 1
                testingTrack:
                  type: object
                  properties:
                    slug:
                      type: string
                      minLength: 1
                    titlePrefix:
                      type: string
                      minLength: 1
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  minimum: 0
                phase:
                  type: string
                  enum:
                    - Pending
                    - Waiting
                    - Reconciling
                    - Validated
                    - WaitingForImages
                    - ValidationBlocked
                    - ValidationFailed
                    - BuildFailed
                    - PushFailed
                    - TestFailed
                    - DeployFailed
                    - DeleteFailed
                    - Ready
                    - Finalized
                    - Error
                    - Stopped
                message:
                  type: string
                reconcileKey:
                  type: string
                baseReconcileKey:
                  type: string
                forceReconcile:
                  type: object
                  properties:
                    token:
                      type: string
                    reason:
                      type: string
                track:
                  type: object
                  properties:
                    organization:
                      type: string
                    slug:
                      type: string
                source:
                  type: object
                  properties:
                    repo:
                      type: string
                    branch:
                      type: string
                    path:
                      type: string
                    revision:
                      type: string
                    commitSha:
                      type: string
                    artifactDigest:
                      type: string
                    gitRepository:
                      type: string
                    namespace:
                      type: string
                    action:
                      type: string
                    authSecretAction:
                      type: string
                content:
                  type: object
                  properties:
                    repo:
                      type: string
                    branch:
                      type: string
                    path:
                      type: string
                    revision:
                      type: string
                    commitSha:
                      type: string
                    artifactDigest:
                      type: string
                    gitRepository:
                      type: string
                    namespace:
                      type: string
                    action:
                      type: string
                    authSecretAction:
                      type: string
                images:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                externalResources:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                buildStatus:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                artifact:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                deployment:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                ecr:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                tracks:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                testing:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                lastError:
                  type: object
                  properties:
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      observedGeneration:
                        type: integer
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
