apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: temporal-worker-controller-crds
  namespace: tmprl-dem-cld-worker-controller
spec:
  chart:
    spec:
      chart: temporal-worker-controller-crds
      sourceRef:
        kind: HelmRepository
        name: temporal-worker-controller
        namespace: flux-system
      version: 0.31.0
  interval: 30m
  releaseName: temporal-worker-controller-crds
  targetNamespace: tmprl-dem-cld-worker-controller
  driftDetection:
    mode: enabled
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: temporal-worker-controller
  namespace: tmprl-dem-cld-worker-controller
spec:
  chart:
    spec:
      chart: temporal-worker-controller
      sourceRef:
        kind: HelmRepository
        name: temporal-worker-controller
        namespace: flux-system
      version: 0.31.0
  # NOTE: this release also depends on the green cert-manager addon being Ready
  # (certmanager.enabled=true below applies a cert-manager.io/v1 Issuer +
  # Certificate). Enforce that ordering at the Kustomization level (or add a
  # cross-namespace dependsOn to the cert-manager HelmRelease) so cert-manager
  # reconciles before this release.
  dependsOn:
    - name: temporal-worker-controller-crds
  interval: 30m
  releaseName: temporal-worker-controller
  targetNamespace: tmprl-dem-cld-worker-controller
  values:
    certmanager:
      # enabled=true: chart creates a self-signed Issuer + Certificate
      # (secret webhook-server-cert) for the controller's own webhook-serving
      # TLS. This only CREATES cert-manager CRs, so cert-manager must already
      # be present in the cluster (our dedicated cert-manager addon).
      enabled: true
    namespace:
      # Namespace is managed by namespace.yaml in this kustomization.
      create: false
    webhook:
      # enabled=false: leaves the OPTIONAL WorkerDeployment validating webhook
      # (failurePolicy: Fail) off. The always-on WorkerResourceTemplate webhook
      # is unaffected. CRD-level CEL validation enforces WorkerDeployment spec
      # constraints at the API server regardless. Revisit separately from the
      # 0.31.0 (app v1.12.0) upgrade.
      enabled: false
    workerResourceTemplate:
      # Kinds the operator may embed in WorkerResourceTemplates. The controller
      # renders one copy per running WorkerDeployment version and gets RBAC for
      # exactly these kinds. Setting this list replaces the chart default, so
      # HPA is kept alongside KEDA ScaledObjects (per-version autoscaling).
      allowedResources:
        - kinds: ["HorizontalPodAutoscaler"]
          apiGroups: ["autoscaling"]
          resources: ["horizontalpodautoscalers"]
        - kinds: ["ScaledObject"]
          apiGroups: ["keda.sh"]
          resources: ["scaledobjects"]
