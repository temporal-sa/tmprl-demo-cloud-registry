apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      version: v1.21.0
  install:
    crds: CreateReplace
  interval: 30m
  releaseName: cert-manager
  targetNamespace: cert-manager
  upgrade:
    crds: CreateReplace
  values:
    crds:
      enabled: true
      keep: true
    serviceAccount:
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::429214323166:role/tmprl-dem-cld-cert-manager
        eks.amazonaws.com/sts-regional-endpoints: "true"
      create: true
      name: cert-manager
