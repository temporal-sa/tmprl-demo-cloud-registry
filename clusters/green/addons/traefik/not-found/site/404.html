<!doctype html>
<!-- A copy of registry/web/static/404.html made standalone: the catalog's
     app.css rules it uses are inlined, and its assets load from /_not-found/. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#141414" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Temporal Field Kit</title>
    <link rel="icon" href="/_not-found/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://temporal.io" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@400;500&display=swap" />
    <style>
      @font-face { font-family: "Aeonik"; src: url("https://temporal.io/fonts/aeonik/Aeonik-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
      @font-face { font-family: "Aeonik"; src: url("https://temporal.io/fonts/aeonik/Aeonik-Medium.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }

      :root {
        color-scheme: dark;
        --space-black: #141414;
        --off-white: #f8fafc;
        --indigo-100: #cacbf9;
        --indigo-300: #7f86f1;
        --ultraviolet: #444ce7;
        --mint: #59fda0;
        --grad-uv: linear-gradient(45deg, #b664ff 0%, #444ce7 100%);
        --font: "Aeonik", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: "Noto Sans Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      img { display: block; max-width: 100%; }
      a { color: inherit; text-decoration: none; }

      html { background: var(--space-black); }
      body {
        min-height: 100vh;
        color: var(--off-white);
        background: var(--space-black);
        font-family: var(--font);
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      ::selection { color: var(--space-black); background: var(--mint); }
      :focus-visible { outline: 2px solid var(--indigo-300); outline-offset: 2px; }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: .5rem;
        padding: .4rem 1rem;
        color: var(--off-white);
        background-color: transparent;
        background-image: var(--grad-uv);
        background-origin: border-box;
        border: 2px solid transparent;
        font-family: var(--mono);
        font-size: .8125rem;
        font-weight: 500;
        line-height: 1.5;
        white-space: nowrap;
        cursor: pointer;
        transition: box-shadow .15s, color .15s, background .15s;
      }
      .btn:hover { box-shadow: 0 0 0 4px rgb(68 76 231 / .7); }
      .btn:active { color: var(--indigo-100); box-shadow: none; }

      .not-found-stars { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .not-found {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        min-height: 100vh;
        padding: 2rem 1rem;
      }
      .not-found-bubble {
        position: relative;
        align-self: center;
        max-width: 22rem;
        margin-bottom: 12rem;
        padding: 1.5rem 1.75rem 1.75rem;
        color: var(--space-black);
        background: #fff;
        box-shadow: 0 10px 30px rgb(0 0 0 / .4);
        font-family: var(--mono);
        animation: ziggy-pop .35s cubic-bezier(.2, 1.4, .4, 1);
      }
      .not-found-bubble::after {
        content: "";
        position: absolute;
        top: 2.5rem;
        right: -1.4rem;
        width: 1.6rem;
        height: 2rem;
        background: #fff;
        clip-path: polygon(0 0, 100% 100%, 0 70%);
      }
      .not-found-bubble h1 { color: var(--ultraviolet); font-size: 1.375rem; font-weight: 500; line-height: 1.3; }
      .not-found-bubble p { margin: .75rem 0 1.25rem; font-size: .9375rem; line-height: 1.5; }

      .not-found-ziggy { position: relative; flex: none; width: min(26rem, 40vw); animation: ziggy-float 10s ease-in-out infinite; }
      .not-found-ziggy img { width: 100%; height: auto; }
      .not-found-ziggy .ziggy-open { animation: ziggy-eyes-open 10s steps(1, end) infinite; }
      .not-found-ziggy .ziggy-blink { position: absolute; inset: 0; opacity: 0; animation: ziggy-eyes-closed 10s steps(1, end) infinite; }

      @keyframes ziggy-float {
        0%, 14%, 100% { transform: translateY(0) rotate(0deg); }
        32% { transform: translateY(-7px) rotate(-3deg); }
        50% { transform: translateY(-2px) rotate(1deg); }
        68%, 84% { transform: translateY(-6px) rotate(-2deg); }
      }
      @keyframes ziggy-pop { from { opacity: 0; transform: translateY(.5rem) scale(.96); } }
      @keyframes ziggy-eyes-open { 0%, 10.4%, 77.4%, 81.4%, 100% { opacity: 1; } 9%, 76%, 80% { opacity: 0; } }
      @keyframes ziggy-eyes-closed { 0%, 10.4%, 77.4%, 81.4%, 100% { opacity: 0; } 9%, 76%, 80% { opacity: 1; } }

      @media (max-width: 720px) {
        .not-found { flex-direction: column; gap: 1.5rem; }
        .not-found-bubble { align-self: auto; margin-bottom: 0; }
        .not-found-bubble::after { top: auto; right: auto; bottom: -1.4rem; left: 50%; width: 2rem; height: 1.6rem; clip-path: polygon(0 0, 100% 0, 30% 100%); }
        .not-found-ziggy { width: min(18rem, 70vw); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <canvas class="not-found-stars" aria-hidden="true"></canvas>
    <main class="not-found">
      <div class="not-found-bubble">
        <h1>We couldn't find that page.</h1>
        <p>The link may be out of date, or the page may have moved.</p>
        <a class="btn" href="https://catalog.tmprl-demo.cloud/">Back to the demos</a>
      </div>
      <div class="not-found-ziggy" aria-hidden="true">
        <img class="ziggy-open" src="/_not-found/ziggy-large.png" alt="" width="416" height="416" />
        <img class="ziggy-blink" src="/_not-found/ziggy-large-blink.png" alt="" width="416" height="416" />
      </div>
    </main>
    <script src="/_not-found/starfield.js"></script>
    <script>Starfield.start(document.querySelector(".not-found-stars"));</script>
  </body>
</html>
