apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cluster-autoscaler
  namespace: kube-system
spec:
  chart:
    spec:
      chart: cluster-autoscaler
      sourceRef:
        kind: HelmRepository
        name: cluster-autoscaler
        namespace: flux-system
      version: 9.58.0
  interval: 30m
  releaseName: cluster-autoscaler
  targetNamespace: kube-system
  driftDetection:
    mode: enabled
  values:
    autoDiscovery:
      clusterName: tmprl-dem-cld-green
    awsRegion: us-west-1
    cloudProvider: aws
    image:
      tag: v1.36.0
    extraArgs:
      balance-similar-node-groups: "true"
      expander: least-waste
      skip-nodes-with-local-storage: "false"
      skip-nodes-with-system-pods: "false"
    podAnnotations:
      cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    rbac:
      serviceAccount:
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::429214323166:role/tmprl-dem-cld-cluster-autoscaler
        create: true
        name: cluster-autoscaler
    resources:
      limits:
        cpu: 200m
        memory: 600Mi
      requests:
        cpu: 100m
        memory: 300Mi
