apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  chart:
    spec:
      chart: external-dns
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      version: 1.21.1
  interval: 30m
  releaseName: external-dns
  targetNamespace: external-dns
  values:
    # AWS Route53. IRSA holds the creds; external-dns needs no static keys.
    provider:
      name: aws
    # Read Traefik v3 IngressRoutes (traefik.io/v1alpha1) natively. The traefik
    # source only emits an endpoint for an IngressRoute carrying an
    # external-dns.alpha.kubernetes.io/target annotation — the operator stamps
    # `target: live.tmprl-demo.cloud` on every route it generates (P5).
    sources:
      - traefik-proxy
    domainFilters:
      - tmprl-demo.cloud
    # sync (not upsert-only) so a deleted demo's record is removed. Bounded by the
    # TXT registry below: external-dns only manages records it owns.
    policy: sync
    registry: txt
    # Per-color owner id keeps blue's and green's ownership TXTs distinct. The
    # extdns- prefix puts each TXT at a different name than the record it guards
    # (extdns-cname-<demo>), so there is no CNAME/TXT clash and external-dns can
    # never claim the pet's *, the live swing, or registry (it owns only records
    # carrying its own TXT).
    txtOwnerId: green
    txtPrefix: extdns-
    serviceAccount:
      create: true
      name: external-dns
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::429214323166:role/tmprl-dem-cld-external-dns
        eks.amazonaws.com/sts-regional-endpoints: "true"
