apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: demoprojects.registry.tmprl-demo.cloud
  labels:
    app.kubernetes.io/name: registry-operator
    app.kubernetes.io/managed-by: flux
spec:
  group: registry.tmprl-demo.cloud
  scope: Cluster
  names:
    plural: demoprojects
    singular: demoproject
    kind: DemoProject
    listKind: DemoProjectList
    shortNames:
      - demo
      - demos
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Namespace
          type: string
          jsonPath: .status.kubernetesNamespaceStatus.name
        - name: Active
          type: string
          jsonPath: .status.activeImageVersion
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - source
                - builds
                - components
              properties:
                source:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    repo:
                      type: string
                      x-kubernetes-validations:
                        - rule: "self.startsWith('https://github.com/temporal-sa/') || self.startsWith('https://github.com/temporalio/')"
                          message: "spec.source.repo must be a https://github.com/temporal-sa/ or https://github.com/temporalio/ repository"
                registry:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                builds:
                  type: object
                  additionalProperties:
                    type: object
                    required:
                      - context
                    properties:
                      context:
                        type: string
                        minLength: 1
                      strategy:
                        type: string
                        enum:
                          - dockerfile
                          - buildpack
                        default: dockerfile
                      dockerfile:
                        type: string
                        minLength: 1
                      builder:
                        type: string
                        minLength: 1
                      env:
                        type: object
                        additionalProperties:
                          type: string
                      processes:
                        type: object
                        minProperties: 1
                        additionalProperties:
                          type: string
                          minLength: 1
                components:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                secrets:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      shared:
                        type: string
                        description: Secret path relative to tmprl-dem-cld/platform/shared/
                        pattern: "^([A-Za-z0-9_+=@-][A-Za-z0-9_+=.@-]*|[.][A-Za-z0-9_+=@-]|[.][A-Za-z0-9_+=.@-]{2,})(/([A-Za-z0-9_+=@-][A-Za-z0-9_+=.@-]*|[.][A-Za-z0-9_+=@-]|[.][A-Za-z0-9_+=.@-]{2,}))*$"
                      requiredProperties:
                        type: array
                        minItems: 1
                        x-kubernetes-list-type: set
                        items:
                          type: string
                          pattern: "^[A-Z_][A-Z0-9_]*$"
                temporal:
                  type: object
                  properties:
                    region:
                      type: string
                      pattern: "^(aws|gcp|azure)-[a-z0-9-]+$"
                      x-kubernetes-validations:
                        - rule: "self.startsWith('aws-') || self.startsWith('gcp-') || self.startsWith('azure-')"
                          message: "spec.temporal.region must use Temporal Cloud provider notation (aws-*, gcp-*, azure-*), e.g. aws-ca-central-1, gcp-us-central1, azure-centralus"
                    auth:
                      type: object
                      properties:
                        mode:
                          type: string
                          enum:
                            - apiKey
                            - mtls
                          default: apiKey
                    searchAttributes:
                      type: object
                      # NOTE: search-attribute key names are intentionally not validated
                      # here. `propertyNames` is valid JSON Schema but is NOT a field of
                      # Kubernetes apiextensions/v1 JSONSchemaProps, so the apiserver
                      # rejects it ("field not declared in schema") and fails the whole
                      # CRD apply. Validate key format in the operator (or a bounded
                      # x-kubernetes-validations CEL rule) if it is needed.
                      additionalProperties:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                              - text
                              - keyword
                              - int
                              - double
                              - bool
                              - datetime
                              - keywordList
                            default: keyword
                    namespaces:
                      type: object
                      # Additional Temporal Cloud namespaces beyond the project's
                      # implicit one. Absent means today's behavior: exactly one
                      # namespace, derived from metadata.name. Each entry inherits the
                      # project's spec.temporal.auth.mode; auth is not per-namespace.
                      #
                      # NOTE: label keys are intentionally not validated here, for the
                      # same reason searchAttributes keys are not (see above):
                      # `propertyNames` is not a field of apiextensions/v1
                      # JSONSchemaProps. Label format, the reserved `candidate` and
                      # `ca-candidate` names, and the 39-character derived-name limit
                      # are enforced by the operator and scripts/validate_projects.py.
                      additionalProperties:
                        type: object
                        properties:
                          region:
                            type: string
                            pattern: "^(aws|gcp|azure)-[a-z0-9-]+$"
                            x-kubernetes-validations:
                              - rule: "self.startsWith('aws-') || self.startsWith('gcp-') || self.startsWith('azure-')"
                                message: "spec.temporal.namespaces[].region must use Temporal Cloud provider notation (aws-*, gcp-*, azure-*), e.g. aws-ca-central-1, gcp-us-central1, azure-centralus"
                          retentionDays:
                            type: integer
                            minimum: 1
                            maximum: 90
                          # No searchAttributes here: the step that manages them
                          # computes its delete set against a single
                          # project-scoped status blob, so it runs for the
                          # project's own namespace only. Declaring them per
                          # namespace would be silently ignored, so the key is
                          # rejected instead.
                    nexusEndpoints:
                      type: object
                      # Nexus Endpoints between this project's own namespaces. Endpoint
                      # names are account-wide unique in Temporal Cloud, so uniqueness is
                      # enforced across the whole registry by scripts/validate_projects.py.
                      #
                      # targetTaskQueue is deliberately not cross-validated: the platform
                      # has never tracked a component's task queue, and this feature does
                      # not introduce that tracking. Keeping it aligned with whatever the
                      # worker polls is the project author's responsibility.
                      additionalProperties:
                        type: object
                        required:
                          - targetTaskQueue
                          - allowedCallerNamespaces
                        properties:
                          targetNamespace:
                            type: string
                            minLength: 1
                            default: primary
                          targetTaskQueue:
                            type: string
                            minLength: 1
                          allowedCallerNamespaces:
                            type: array
                            minItems: 1
                            x-kubernetes-list-type: set
                            items:
                              type: string
                              minLength: 1
                ingress:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                smokeCheck:
                  type: object
                  required:
                    - path
                    - expectedStatus
                  properties:
                    path:
                      type: string
                      pattern: "^/.*$"
                    expectedStatus:
                      type: integer
                      minimum: 100
                      maximum: 599
                    timeoutSeconds:
                      type: integer
                      minimum: 1
                      maximum: 60
            status:
              type: object
              properties:
                activeRevision:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                candidateRevision:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                lastFailedRevision:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                diagnosticsStatus:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                lastFailedDiagnostics:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                workerDeploymentRollbackStatus:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                revisionCleanupStatus:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                observedGeneration:
                  type: integer
                  minimum: 0
                phase:
                  type: string
                  enum:
                    - Pending
                    - Reconciling
                    - RotatingTemporalApiKey
                    - BaseReconciled
                    - WaitingForImages
                    - WaitingForExternalResources
                    - CandidateApplied
                    - CandidateNotReady
                    - WorkerRolloutPending
                    - WorkerRolloutReady
                    - WorkerRolloutFailed
                    - SmokeCheckPending
                    - SmokeCheckFailed
                    - Promoted
                    - Ready
                    - Finalized
                    - Error
                    - Stopped
                message:
                  type: string
                reconcileKey:
                  type: string
                baseReconcileKey:
                  type: string
                forceReconcile:
                  type: object
                  properties:
                    token:
                      type: string
                    reason:
                      type: string
                lastError:
                  type: object
                  properties:
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
                activeImageVersion:
                  type: string
                activeRuntimeNamespace:
                  type: string
                temporalRuntimeSecretPath:
                  type: string
                activeImages:
                  type: object
                  additionalProperties:
                    type: string
                activeRouteServices:
                  type: object
                  additionalProperties:
                    type: string
                kubernetesNamespaceStatus:
                  type: object
                  properties:
                    name:
                      type: string
                    phase:
                      type: string
                    action:
                      type: string
                    mode:
                      type: string
                    message:
                      type: string
                    error:
                      type: string
                runtimeNamespaceStatus:
                  type: object
                  properties:
                    name:
                      type: string
                    phase:
                      type: string
                    action:
                      type: string
                    mode:
                      type: string
                    message:
                      type: string
                    error:
                      type: string
                buildStatus:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                readinessStatus:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                workerDeploymentStatus:
                  type: object
                  properties:
                    phase:
                      type: string
                    checkedAt:
                      type: string
                      format: date-time
                    message:
                      type: string
                    resources:
                      type: array
                      items:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                externalSecretStatus:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                externalResourceBlock:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                candidateRolloutStatus:
                  type: object
                  properties:
                    phase:
                      type: string
                    sourceCommitSha:
                      type: string
                    sourceArtifactDigest:
                      type: string
                    imageVersion:
                      type: string
                    runtimeNamespace:
                      type: string
                    url:
                      type: string
                    images:
                      type: object
                      additionalProperties:
                        type: string
                    services:
                      type: object
                      additionalProperties:
                        type: string
                    deployments:
                      type: object
                      additionalProperties:
                        type: string
                    workerDeployments:
                      type: object
                      additionalProperties:
                        type: string
                    startedAt:
                      type: string
                      format: date-time
                    completedAt:
                      type: string
                      format: date-time
                    message:
                      type: string
                smokeCheckStatus:
                  type: object
                  properties:
                    phase:
                      type: string
                    path:
                      type: string
                    expectedStatus:
                      type: integer
                    actualStatus:
                      type: integer
                    checkedAt:
                      type: string
                      format: date-time
                    message:
                      type: string
                pruneStatus:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                prunedResources:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                finalizeStatus:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                externalResources:
                  type: object
                  properties:
                    phase:
                      type: string
                    mode:
                      type: string
                    checkedAt:
                      type: string
                      format: date-time
                    kubernetesNamespace:
                      type: string
                    ecr:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    secretsManager:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    temporalCloud:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                appliedResources:
                  type: array
                  items:
                    type: object
                    properties:
                      apiVersion:
                        type: string
                      kind:
                        type: string
                      namespace:
                        type: string
                      name:
                        type: string
                      action:
                        type: string
                reconcileMode:
                  type: string
                  enum:
                    - plan
                    - apply
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      observedGeneration:
                        type: integer
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
