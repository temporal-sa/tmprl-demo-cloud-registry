# Every path answers 404 with the page. Its assets sit under /_not-found/ so the
# page can load them from whatever unknown host it is served on.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log off;

    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
    }

    location /_not-found/ {
        alias /usr/share/nginx/html/;
    }

    location = /healthz {
        return 200;
    }

    location / {
        return 404;
    }
}
