apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
  labels:
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/managed-by: flux
spec:
  acme:
    email: sa@temporal.io
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt
    solvers:
      - dns01:
          route53:
            region: us-west-1
            hostedZoneID: Z08792403SH7ADUAH7X5X
