apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: temporal-worker-controller-crds
  namespace: tmprl-dem-cld-worker-controller
spec:
  chart:
    spec:
      chart: temporal-worker-controller-crds
      sourceRef:
        kind: HelmRepository
        name: temporal-worker-controller
        namespace: flux-system
      version: 0.27.0
  interval: 30m
  releaseName: temporal-worker-controller-crds
  targetNamespace: tmprl-dem-cld-worker-controller
  driftDetection:
    mode: enabled
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: temporal-worker-controller
  namespace: tmprl-dem-cld-worker-controller
spec:
  chart:
    spec:
      chart: temporal-worker-controller
      sourceRef:
        kind: HelmRepository
        name: temporal-worker-controller
        namespace: flux-system
      version: 0.27.0
  # NOTE: this release also depends on the blue cert-manager addon being Ready
  # (certmanager.enabled=true below applies a cert-manager.io/v1 Issuer +
  # Certificate). Enforce that ordering at the Kustomization level (or add a
  # cross-namespace dependsOn to the cert-manager HelmRelease) so cert-manager
  # reconciles before this release.
  dependsOn:
    - name: temporal-worker-controller-crds
  interval: 30m
  releaseName: temporal-worker-controller
  targetNamespace: tmprl-dem-cld-worker-controller
  values:
    certmanager:
      # enabled=true: chart creates a self-signed Issuer + Certificate
      # (secret webhook-server-cert) for the controller's own webhook-serving
      # TLS. This only CREATES cert-manager CRs, so cert-manager must already
      # be present in the cluster (our dedicated cert-manager addon).
      enabled: true
      # install=false (CHANGED from the pet's true). In chart 0.27.0 (and
      # 0.26.0) install=true is the condition on a FULL cert-manager v1.20.1
      # Helm subchart (charts.jetstack.io) — it deploys an entire second
      # cert-manager, NOT just an Issuer/Certificate. Blue runs its own
      # cert-manager addon, so the subchart would conflict. Keep false and
      # rely on the addon.
      install: false
    namespace:
      # Namespace is managed by namespace.yaml in this kustomization.
      create: false
    webhook:
      # enabled=false: leaves the OPTIONAL WorkerDeployment validating webhook
      # (failurePolicy: Fail) off. The always-on WorkerResourceTemplate webhook
      # is unaffected. The pet disabled it because the v1.7.0 manager 404s that
      # path; the 1.8.0 (chart 0.27.0) changelog adds no WorkerDeployment
      # webhook serving, and CRD-level CEL validation now enforces spec
      # constraints at the API server regardless. Enabling it against a
      # non-serving manager would block all WorkerDeployment writes. Revisit
      # only once webhook serving is confirmed for the running app version.
      enabled: false
