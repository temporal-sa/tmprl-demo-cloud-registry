apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tmprl-dem-cld-registry-operator
resources:
  - namespace.yaml
  - rbac.yaml
  - external-secrets.yaml
  - deployment.yaml
  # web.yaml removed (P8 phase A): the catalog web is now rendered by the
  # registry.yaml self-demo's web component (wired via the registry-operator-self
  # Flux Kustomization), not hand-authored here.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: registry-operator-common-config
    literals:
      # The color IS the task queue: the operator derives registry-management-blue
      # from DEMO_REGISTRY_CLUSTER. Do NOT set DEMO_REGISTRY_TASK_QUEUE here — an
      # explicit value overrides the color derivation and yields an uncolored queue.
      - DEMO_REGISTRY_CLUSTER=blue
      - DEMO_REGISTRY_EXTERNAL_RESOURCE_MODE=aws
      - DEMO_REGISTRY_TEMPORAL_CLOUD_MODE=cloud-api
      - DEMO_REGISTRY_BUILD_MODE=aws-codebuild
      - DEMO_REGISTRY_CODEBUILD_PROJECT=tmprl-dem-cld-build
      - DEMO_REGISTRY_CODEBUILD_POLL_SECONDS=30
      - DEMO_REGISTRY_CODEBUILD_TIMEOUT_MINUTES=30
      - DEMO_REGISTRY_AWS_REGION=us-west-1
      - DEMO_REGISTRY_ROLLOUT_DIAGNOSTICS_BUCKET=tmprl-dem-cld-rollout-diagnostics-429214323166-us-west-1
      - DEMO_REGISTRY_PUBLIC_ECR_REGION=us-east-1
      - DEMO_REGISTRY_AWS_ACCOUNT_ID=429214323166
      - DEMO_REGISTRY_TEMPORAL_CLOUD_ACCOUNT_ID=a2dd6
      - DEMO_REGISTRY_TEMPORAL_CLOUD_REGION=aws-ca-central-1
      - DEMO_REGISTRY_READINESS_TIMEOUT_SECONDS=300
      - DEMO_REGISTRY_READINESS_POLL_SECONDS=5
      - DEMO_REGISTRY_CATALOG_STATUS_NAMESPACE=tmprl-dem-cld-registry-operator
      - DEMO_REGISTRY_CATALOG_STATUS_CONFIGMAP=registry-catalog-status
      - DEMO_REGISTRY_CATALOG_STATUS_MIRROR_NAMESPACE=tmprl-dem-cld-registry-operator
      - DEMO_REGISTRY_SOURCE_WATCH_NAMESPACE=tmprl-dem-cld-registry-operator
      - DEMO_REGISTRY_SOURCE_WATCH_INTERVAL=1m
      - DEMO_REGISTRY_ACTIVITY_WORKERS=20
      # temporalProxy sidecar image (Temporal Cloud gRPC proxy) stamped into demos
      # that enable temporalProxy (durable-banking-skills, pizza-worker-versioning).
      # Required for those demos or reconcile fails with
      # "DEMO_REGISTRY_TEMPORAL_PROXY_IMAGE is required when temporalProxy is enabled".
      # Latest proxy build (== the pet's proven tag).
      - DEMO_REGISTRY_TEMPORAL_PROXY_IMAGE=429214323166.dkr.ecr.us-west-1.amazonaws.com/tmprl-dem-cld/registry-operator/temporal-cloud-proxy:git-bb9b9839e384
  # P8 phase B self-managing split: the bootstrap pod is WATCH-ONLY (no in-process
  # worker). In WATCH_MODE=bootstrap it reconciles the registry.yaml self-demo, which
  # self-renders the REAL operator as the versioned WorkerDeployment named in
  # WATCH_HANDOFF_DEPLOYMENT, then scales itself back to 0. The handoff name MUST match
  # the self-rendered WD name (GAP-2 color-suffixes it to registry-operator-blue).
  - name: registry-operator-watch-config
    literals:
      - DEMO_REGISTRY_WORKER_ENABLED=false
      - DEMO_REGISTRY_WATCH_ENABLED=true
      - DEMO_REGISTRY_WATCH_MODE=bootstrap
      - DEMO_REGISTRY_WATCH_HANDOFF_DEPLOYMENT=tmprl-dem-cld-registry-operator/registry-operator-blue
      - DEMO_REGISTRY_WATCH_INTERVAL_SECONDS=15
