# Blue's operator runs as a single self-contained worker+watch process (P5 e2e /
# cutover prep). Unlike the pet's split (a scaled-to-zero watch/bootstrap handing
# off to a self-rendered versioned WorkerDeployment), blue runs one Deployment
# that both polls its color task queue (registry-management-blue) AND watches
# DemoProject CRs — enough to reconcile demos on blue without the self-management
# dance. Worker versioning is intentionally off (no TEMPORAL_DEPLOYMENT_NAME), so
# the namespace-wide worker-update batch signal never runs here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-operator
  namespace: tmprl-dem-cld-registry-operator
  labels:
    app.kubernetes.io/name: registry-operator
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry-operator
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-operator
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: registry-operator
      containers:
        - name: operator
          image: 429214323166.dkr.ecr.us-west-1.amazonaws.com/tmprl-dem-cld/registry-operator/worker:git-039388a8d9cf
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: registry-operator-common-config
            - configMapRef:
                name: registry-operator-config
            - secretRef:
                name: registry-worker-temporal
            - secretRef:
                name: temporal-cloud-bootstrap
            - secretRef:
                name: instruqt-cli
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
