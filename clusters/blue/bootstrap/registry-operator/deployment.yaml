# Blue's static full worker+watch operator (polls registry-management-blue + watches
# DemoProject CRs). P8 phase A KEEPS this running as the RENDERER: with the
# registry.yaml self-demo now wired (registry-operator-self Kustomization), THIS
# worker reconciles it and self-renders the real, versioned, canary-gated operator
# WorkerDeployment registry-operator-blue (GAP-2 color suffix) — a watch-only bootstrap
# could not, since rendering runs inside DemoProjectWorkflow and needs a worker on the
# queue. Phase B (separate follow-on, AFTER registry-operator-blue is promoted) replaces
# this Deployment with the scaled-to-zero registry-operator-watch bootstrap and prunes
# this full worker; the two only overlap as full workers briefly during the handoff
# (same color, already-provisioned demos -> steady-state adopt, low risk).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-operator
  namespace: tmprl-dem-cld-registry-operator
  labels:
    app.kubernetes.io/name: registry-operator
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: registry-operator
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-operator
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: registry-operator
      # Same dnsConfig the operator stamps on every workload it renders
      # (resources.workload_dns_config). The Temporal Cloud endpoint is a 4-dot
      # FQDN; with the default ndots:5 glibc tries cluster search domains first,
      # and a dropped lookup wedges the worker's gRPC DNS resolver in a permanent
      # "dns error" poll-retry loop. ndots:2 resolves the FQDN absolute-first;
      # single-request-reopen serializes A/AAAA to dodge the conntrack race.
      dnsConfig:
        options:
          - name: ndots
            value: "2"
          - name: single-request-reopen
      containers:
        - name: operator
          image: 429214323166.dkr.ecr.us-west-1.amazonaws.com/tmprl-dem-cld/registry-operator/worker:git-7fe0dc2a3047
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: registry-operator-common-config
            - configMapRef:
                name: registry-operator-config
            - secretRef:
                name: registry-worker-temporal
            - secretRef:
                name: temporal-cloud-bootstrap
            - secretRef:
                name: instruqt-cli
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
