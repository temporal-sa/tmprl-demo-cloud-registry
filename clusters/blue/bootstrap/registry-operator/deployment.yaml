# Blue's operator now uses the pet's SELF-MANAGING split (P8), color-aware:
#   - THIS is the bootstrap "watch" Deployment: watch-only (WORKER_ENABLED=false),
#     replicas:0 in steady state. On a cold start (no self-rendered operator yet)
#     it is scaled to 1; in WATCH_MODE=bootstrap it reconciles the registry.yaml
#     self-demo, which self-renders the REAL operator as a versioned WorkerDeployment
#     named registry-operator-blue (GAP-2 color suffix), then scales itself back to 0
#     once WATCH_HANDOFF_DEPLOYMENT has a current ready build.
#   - The self-rendered registry-operator-blue worker is what polls
#     registry-management-blue and reconciles the catalog; its image comes from the
#     self-build pipeline (canary-gated rollout), NOT this manifest.
# Image here is only the bootstrap renderer (the self-rendered worker's image comes
# from the canary-gated self-build). It is pinned + must be bumped to the GAP-fixed
# seed image before the cold-start scale-up (gated cutover). The $imagepolicy setter
# marker is a ready hook, but auto-bump is a P8 open item: the operator self-build
# tags git-<sha> (unorderable), so a Flux ImagePolicy needs the build to emit an
# orderable tag (e.g. a timestamp) first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry-operator-watch
  namespace: tmprl-dem-cld-registry-operator
  labels:
    app.kubernetes.io/name: registry-operator
    app.kubernetes.io/component: watch
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: registry-operator
      app.kubernetes.io/component: watch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-operator
        app.kubernetes.io/component: watch
    spec:
      serviceAccountName: registry-operator
      # Same ndots dnsConfig as the self-rendered worker: the watch opens a Temporal
      # Cloud gRPC connection (signal-with-start of entity workflows), and the 4-dot
      # TC FQDN wedges the resolver under the default ndots:5 (P5 gotcha ba72b00).
      dnsConfig:
        options:
          - name: ndots
            value: "2"
          - name: single-request-reopen
      containers:
        - name: watch
          image: 429214323166.dkr.ecr.us-west-1.amazonaws.com/tmprl-dem-cld/registry-operator/worker:git-7fe0dc2a3047 # {"$imagepolicy": "flux-system:registry-operator-worker"}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: registry-operator-common-config
            - configMapRef:
                name: registry-operator-watch-config
            - secretRef:
                name: registry-worker-temporal
            - secretRef:
                name: temporal-cloud-bootstrap
            - secretRef:
                name: instruqt-cli
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
