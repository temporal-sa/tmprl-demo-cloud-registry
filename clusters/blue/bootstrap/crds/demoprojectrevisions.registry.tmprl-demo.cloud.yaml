apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: demoprojectrevisions.registry.tmprl-demo.cloud
  labels:
    app.kubernetes.io/name: registry-operator
    app.kubernetes.io/managed-by: flux
spec:
  group: registry.tmprl-demo.cloud
  scope: Cluster
  names:
    plural: demoprojectrevisions
    singular: demoprojectrevision
    kind: DemoProjectRevision
    listKind: DemoProjectRevisionList
    shortNames:
      - dpr
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Project
          type: string
          jsonPath: .spec.projectName
        - name: Version
          type: string
          jsonPath: .spec.rolloutVersion
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: RuntimeNamespace
          type: string
          jsonPath: .spec.runtimeNamespace
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - projectName
                - rolloutVersion
              properties:
                projectName:
                  type: string
                rolloutVersion:
                  type: string
                reconcileKey:
                  type: string
                sourceCommitSha:
                  type: string
                sourceArtifactDigest:
                  type: string
                runtimeNamespace:
                  type: string
                runtimeNamespaceEnabled:
                  type: boolean
                host:
                  type: string
                images:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                components:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                workerDeployments:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                smokeCheck:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Applied
                    - WorkerRolloutPending
                    - WorkerRolloutReady
                    - Smoking
                    - Promoted
                    - Failed
                    - Superseded
                    - Deleting
                    - Deleted
                message:
                  type: string
                observedGeneration:
                  type: integer
                  minimum: 0
