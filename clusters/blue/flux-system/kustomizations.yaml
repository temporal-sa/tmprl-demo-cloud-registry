# Active blue cluster (tmprl-dem-cld-blue) root sync. OpenTofu installs Flux and
# this root object; the Kustomizations below reconcile the platform, registry,
# project catalog, Instruqt courses, and LiteLLM app layer from this repository.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  path: ./clusters/blue/flux-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: node-local-dns
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/blue/addons/node-local-dns/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: node-local-dns
      namespace: kube-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/blue/addons/metrics-server/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: metrics-server
      namespace: kube-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-autoscaler
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/blue/addons/cluster-autoscaler/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cluster-autoscaler
      namespace: kube-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-install
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/blue/addons/external-secrets/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-stores
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets-install
  interval: 5m
  path: ./clusters/blue/addons/external-secrets/stores
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/blue/addons/cert-manager/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager
  interval: 5m
  path: ./clusters/blue/addons/cert-manager/issuers
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: temporal-worker-controller
  namespace: flux-system
spec:
  dependsOn:
    - name: node-local-dns
    - name: cert-manager
  interval: 5m
  path: ./clusters/blue/addons/temporal-worker-controller/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 10m
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: temporal-worker-controller-crds
      namespace: tmprl-dem-cld-worker-controller
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: temporal-worker-controller
      namespace: tmprl-dem-cld-worker-controller
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/blue/addons/traefik/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: traefik
      namespace: traefik
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns
  namespace: flux-system
spec:
  # Reads Traefik IngressRoutes, so it follows traefik.
  dependsOn:
    - name: traefik
  interval: 5m
  path: ./clusters/blue/addons/external-dns/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-dns
      namespace: external-dns
---
# Wildcard TLS (P5). One *.tmprl-demo.cloud cert + a Traefik default TLSStore so
# managed demos are served a shared wildcard cert and never mint per-host Let's
# Encrypt certs (rate-limit avoidance). Needs the letsencrypt issuer + traefik.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wildcard-cert
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager-issuers
    - name: traefik
  interval: 5m
  path: ./clusters/blue/addons/wildcard-cert/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 10m
  wait: true
---
# Registry layer. CRDs + the operator itself (P5) + the real catalog (P7). The
# operator runs as one worker+watch Deployment on task queue
# registry-management-blue (color set in its configMap).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: registry-crds
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/blue/bootstrap/crds
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: registry-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: node-local-dns
    - name: external-secrets-stores
    - name: registry-crds
    - name: temporal-worker-controller
  interval: 5m
  path: ./clusters/blue/bootstrap/registry-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: registry-operator-watch
      namespace: tmprl-dem-cld-registry-operator
---
# Operator self-management (P8 phase A). The registry.yaml self-demo (kept at
# ./projects/operator so sibling colors never co-manage it). The RUNNING operator
# reconciles it into the self-rendered, versioned, canary-gated operator
# WorkerDeployment registry-operator-blue — in phase A that renderer is blue's static
# registry-operator worker; after phase B it is registry-operator-blue itself
# (self-management). The spec is color-agnostic; the operator injects the color (task
# queue + WorkerDeployment name). dependsOn the bootstrap (registry-operator) + CRDs +
# worker-controller.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: registry-operator-self
  namespace: flux-system
spec:
  dependsOn:
    - name: registry-operator
    - name: registry-crds
    - name: temporal-worker-controller
  interval: 5m
  path: ./projects/operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
---
# Real demo catalog (P7). DemoProject CRs under ./projects/demo. The operator
# self-demo (registry.yaml, name: registry-operator) lives at ./projects/operator
# and is wired via the registry-operator-self Kustomization above — NOT here — so a
# single color owns it. Mirrors the pet's registry-projects.
#
# ⛔ STANDBY: once this reaches blue, blue's operator reconciles the SAME demos
# the pet manages, sharing each demo's color-agnostic Temporal Cloud namespace /
# runtime service account / runtime secret. Concurrent reconcile is NOT safe
# (audit: TC service-account dup + runtime-secret last-writer-wins). The pet
# operator MUST be scaled to 0 before this is pushed, so blue is the sole
# reconciler.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: registry-projects
  namespace: flux-system
spec:
  dependsOn:
    - name: node-local-dns
    - name: registry-operator
    - name: temporal-worker-controller
  interval: 5m
  path: ./projects/demo
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: registry-instruqt-courses
  namespace: flux-system
spec:
  dependsOn:
    - name: node-local-dns
    - name: registry-operator
  interval: 5m
  path: ./projects/instruqt
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
---
# instruqt-litellm app layer (P7). LiteLLM gateway + credential-authenticated
# token broker, with Traefik v3, Flux image CRD v1,
# tmprl-dem-cld-instruqt-litellm-broker IRSA role, external-dns target annotation,
# and the shared wildcard cert. Backed by the shared LiteLLM RDS in the Tofu VPC
# (infra/litellm_rds.tf), reached via DATABASE_URL in the shared SM secret
# tmprl-dem-cld/platform/instruqt-litellm/runtime (LITELLM_MASTER_KEY/SALT there
# are unchanged, so the snapshot-migrated virtual keys stay valid).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: instruqt-litellm
  namespace: flux-system
spec:
  dependsOn:
    - name: node-local-dns
    - name: external-secrets-stores
    - name: traefik
    - name: wildcard-cert
  interval: 5m
  path: ./clusters/blue/addons/instruqt-litellm/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: instruqt-litellm-runtime
      namespace: tmprl-dem-cld-instruqt-litellm
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: instruqt-litellm-broker
      namespace: tmprl-dem-cld-instruqt-litellm
