# Blue cluster (tmprl-dem-cld-blue) root sync — P3 platform layer.
#
# Duplicated from clusters/sa-demo/ with paths repointed to ./clusters/blue/ and
# IRSA annotations moved to the tmprl-dem-cld-* roles (P2). cert-manager +
# ClusterIssuers are new here (installed out-of-band on the pet). The app layer
# (instruqt-litellm) and the registry layer (CRDs, operator, projects, courses)
# are intentionally NOT wired yet — they land in later phases (operator runs
# scaled-to-zero until the P6 cutover).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  path: ./clusters/blue/flux-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: node-local-dns
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/blue/addons/node-local-dns/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: DaemonSet
      name: node-local-dns
      namespace: kube-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/blue/addons/metrics-server/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: metrics-server
      namespace: kube-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-autoscaler
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/blue/addons/cluster-autoscaler/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cluster-autoscaler
      namespace: kube-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-install
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/blue/addons/external-secrets/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-stores
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets-install
  interval: 5m
  path: ./clusters/blue/addons/external-secrets/stores
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/blue/addons/cert-manager/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager
  interval: 5m
  path: ./clusters/blue/addons/cert-manager/issuers
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: temporal-worker-controller
  namespace: flux-system
spec:
  dependsOn:
    - name: node-local-dns
    - name: cert-manager
  interval: 5m
  path: ./clusters/blue/addons/temporal-worker-controller/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 10m
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: temporal-worker-controller-crds
      namespace: tmprl-dem-cld-worker-controller
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: temporal-worker-controller
      namespace: tmprl-dem-cld-worker-controller
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/blue/addons/traefik/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: traefik
      namespace: traefik
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns
  namespace: flux-system
spec:
  # Reads Traefik IngressRoutes, so it follows traefik.
  dependsOn:
    - name: traefik
  interval: 5m
  path: ./clusters/blue/addons/external-dns/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-dns
      namespace: external-dns
---
# Wildcard TLS (P5). One *.tmprl-demo.cloud cert + a Traefik default TLSStore so
# managed demos are served a shared wildcard cert and never mint per-host Let's
# Encrypt certs (rate-limit avoidance). Needs the letsencrypt issuer + traefik.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wildcard-cert
  namespace: flux-system
spec:
  dependsOn:
    - name: cert-manager-issuers
    - name: traefik
  interval: 5m
  path: ./clusters/blue/addons/wildcard-cert/install
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 10m
  wait: true
---
# Registry layer. CRDs + the operator itself (P5) + the real catalog (P7). The
# operator runs as one worker+watch Deployment on task queue
# registry-management-blue (color set in its configMap).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: registry-crds
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/blue/bootstrap/crds
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: registry-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: node-local-dns
    - name: external-secrets-stores
    - name: registry-crds
    - name: temporal-worker-controller
  interval: 5m
  path: ./clusters/blue/bootstrap/registry-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: registry-operator
      namespace: tmprl-dem-cld-registry-operator
---
# Real demo catalog (P7). DemoProject CRs under ./projects/demo. The operator
# self-demo (registry.yaml, name: registry-operator) was split out to
# ./projects/operator and is intentionally NOT wired here — blue's operator is
# Flux-bootstrapped, so reconciling the self-demo would stand up a second,
# colliding operator. Mirrors the pet's registry-projects.
#
# ⛔ STANDBY: once this reaches blue, blue's operator reconciles the SAME demos
# the pet manages, sharing each demo's color-agnostic Temporal Cloud namespace /
# runtime service account / runtime secret. Concurrent reconcile is NOT safe
# (audit: TC service-account dup + runtime-secret last-writer-wins). The pet
# operator MUST be scaled to 0 before this is pushed, so blue is the sole
# reconciler. See docs/iac-migration-plan.md (P7 big-bang standby).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: registry-projects
  namespace: flux-system
spec:
  dependsOn:
    - name: node-local-dns
    - name: registry-operator
    - name: temporal-worker-controller
  interval: 5m
  path: ./projects/demo
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: registry-instruqt-courses
  namespace: flux-system
spec:
  dependsOn:
    - name: node-local-dns
    - name: registry-operator
  interval: 5m
  path: ./projects/instruqt
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-gitops-config
  timeout: 5m
  wait: true
---
# instruqt-litellm app layer — DEFERRED (P7 follow-up), intentionally NOT wired.
# The ported tree lives at clusters/blue/addons/instruqt-litellm/, but the LiteLLM
# gateway needs its Postgres DB (RDS temporal-instruqt-litellm) which is PRIVATE in
# the pet's VPC (vpc-00bb9a602ae4bad2c, 10.0.0.0/16) with no peering to blue's VPC
# (10.20.0.0/16) — blue has no network path, and that DB dies with the pet anyway.
# The 2 migrated Instruqt courses do NOT use litellm, so this does not block P7.
# Re-wire once litellm has a blue-reachable database (its own RDS in blue's VPC).
# Until then litellm-instruqt / litellm-broker-instruqt resolve to the pet via the
# wildcard (external-dns retracts blue's records when this Kustomization is pruned).
