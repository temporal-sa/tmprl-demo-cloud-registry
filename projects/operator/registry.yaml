apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: DemoProject
metadata:
  name: registry-operator
  annotations:
    registry.tmprl-demo.cloud/catalog: "true"
    registry.tmprl-demo.cloud/finalization-policy: retain
spec:
  registry:
    title: Demo Cloud Registry
    summary: Landing page for Temporal demo projects, reconciled from reviewed project configs and backed by platform workflows for demo environment management.
    tags:
      - Registry
      - Platform
      - Demo Management
      - Temporal Cloud
    temporalSdks:
      - Python
      - Go
    links:
      runbook:
        label: Operations runbook
        url: https://github.com/temporal-sa/tmprl-demo-cloud-registry/blob/main/docs/operations.md

  source:
    repo: https://github.com/temporal-sa/tmprl-demo-cloud-registry
    gitRepository:
      url: ssh://git@github.com/temporal-sa/tmprl-demo-cloud-registry.git
      authSecret: source-auth
      ignore: |
        /*
        !/registry/
        /registry/*
        !/registry/web/
        !/registry/web/**
        !/registry/worker/
        !/registry/worker/**
        !/registry/temporal-cloud-proxy/
        !/registry/temporal-cloud-proxy/**
        !/schemas/
        !/schemas/**
        !/scripts/
        /scripts/*
        !/scripts/validate_projects.py
    # branch defaults to main

  builds:
    web:
      context: .
      dockerfile: registry/web/Dockerfile
    worker:
      context: .
      dockerfile: registry/worker/Dockerfile
    temporal-cloud-proxy:
      context: .
      dockerfile: registry/temporal-cloud-proxy/Dockerfile

  secrets:
    temporal-cloud-bootstrap: {}

  components:
    web:
      build: web
      # The catalog UI drives the CrashableWorkspaceWorkflow via an untyped
      # Temporal client. The platform Temporal connection
      # (TEMPORAL_ADDRESS/NAMESPACE/API_KEY/TLS) is injected via the operator's
      # own registry-worker-temporal secret — the catalog web component is
      # special-cased for that in resources.env_from_refs (alongside shared-auth)
      # so the web pod talks to the same namespace + task queue where the
      # operator runs the crashable-workspace workflows. We deliberately do NOT
      # use temporalAccess here: that would mount a per-project temporal-credentials
      # secret for a namespace this project doesn't provision.
      env:
        - name: AUTH_MODE
          value: google
        # DEMO_REGISTRY_TASK_QUEUE intentionally NOT set: the operator injects the
        # color-derived queue (registry-management-<color>) into the web via
        # resources.platform_env_vars, so CrashableWorkspaceWorkflow starts land on
        # the queue this color's operator polls. Setting it here would pin the pet's
        # uncolored queue.
      # single unnamed port -> name "http"; servicePort 80 -> public catch-all
      ports:
        - containerPort: 8080
          servicePort: 80

    registry-operator:
      build: worker
      awsIamRoleArn: arn:aws:iam::429214323166:role/tmprl-dem-cld-registry-operator-bg
      automountServiceAccountToken: true
      secrets:
        - temporal-cloud-bootstrap
      env:
        # DEMO_REGISTRY_TASK_QUEUE intentionally NOT set: the self-rendered operator
        # derives it from the injected DEMO_REGISTRY_CLUSTER (registry-management-<color>
        # via config.from_env). An explicit value wins over the color-derived default
        # (config.py) and would put the self-rendered operator back on the uncolored
        # registry-management queue — where its color-scoped entity workflows have no
        # poller.
        - name: DEMO_REGISTRY_EXTERNAL_RESOURCE_MODE
          value: aws
        - name: DEMO_REGISTRY_TEMPORAL_CLOUD_MODE
          value: cloud-api
        - name: DEMO_REGISTRY_TEMPORAL_CLOUD_BOOTSTRAP_SECRET_PATH
          value: tmprl-dem-cld/registry-operator/temporal-cloud-bootstrap
        - name: DEMO_REGISTRY_BUILD_MODE
          value: aws-codebuild
        - name: DEMO_REGISTRY_CODEBUILD_PROJECT
          value: tmprl-dem-cld-build
        - name: DEMO_REGISTRY_CODEBUILD_POLL_SECONDS
          value: "30"
        - name: DEMO_REGISTRY_CODEBUILD_TIMEOUT_MINUTES
          value: "30"
        - name: DEMO_REGISTRY_AWS_REGION
          value: us-west-1
        - name: DEMO_REGISTRY_AWS_ACCOUNT_ID
          value: "429214323166"
        - name: DEMO_REGISTRY_TEMPORAL_CLOUD_ACCOUNT_ID
          value: a2dd6
        - name: DEMO_REGISTRY_TEMPORAL_CLOUD_REGION
          value: gcp-us-central1
        - name: DEMO_REGISTRY_READINESS_TIMEOUT_SECONDS
          value: "300"
        - name: DEMO_REGISTRY_READINESS_POLL_SECONDS
          value: "5"
        - name: DEMO_REGISTRY_CATALOG_STATUS_NAMESPACE
          value: tmprl-dem-cld-registry-operator
        - name: DEMO_REGISTRY_CATALOG_STATUS_CONFIGMAP
          value: registry-catalog-status
        - name: DEMO_REGISTRY_CATALOG_STATUS_MIRROR_NAMESPACE
          value: tmprl-dem-cld-registry-operator
        - name: DEMO_REGISTRY_SOURCE_WATCH_NAMESPACE
          value: tmprl-dem-cld-registry-operator
        - name: DEMO_REGISTRY_SOURCE_WATCH_INTERVAL
          value: 1m
        - name: DEMO_REGISTRY_ACTIVITY_WORKERS
          value: "20"
        - name: DEMO_REGISTRY_WORKER_ENABLED
          value: "true"
        - name: DEMO_REGISTRY_WATCH_ENABLED
          value: auto
      worker:
        # Restart the worker if its in-process Temporal connection wedges (e.g. a
        # stuck gRPC DNS resolver leaves it Running but not polling). The worker
        # process refreshes the heartbeat file only on a successful Temporal
        # round-trip; the rendered liveness probe restarts the container when it
        # goes stale. Safe to enable here because this worker writes the heartbeat.
        livenessProbe: true
        versioning:
          enabled: true
          rollout:
            strategy: AllAtOnce
            gate:
              workflowType: RegistryOperatorCanaryWorkflow
              # Canary project templates are external, self-contained YAML files
              # under demo_registry_operator.canary_templates (api-key.yaml,
              # mtls.yaml, ...). RegistryOperatorCanaryWorkflow loads them via the
              # load_canary_templates activity and launches one branch per template
              # in parallel. Add a new canary type by dropping in a new template
              # file — no change needed here. The gate input below only carries the
              # shared run policy (naming, timeouts, cleanup).
              input:
                projectNamePrefix: operator-canary
                timeoutSeconds: 900
                # Allow Lambda invocations and cached pollers to expire before
                # deleting workspace Worker Deployments and source dependencies.
                cleanupTimeoutSeconds: 1800
                pollSeconds: 10
                cleanupPolicy: Always
          sunset:
            scaledownDelay: 1m
            deleteDelay: 5m

  ingress:
    subdomain: catalog
    temporalAuthRequired: true
    # routes default to a catch-all at the servicePort-80 component (web)

  smokeCheck:
    path: /health
    expectedStatus: 200
