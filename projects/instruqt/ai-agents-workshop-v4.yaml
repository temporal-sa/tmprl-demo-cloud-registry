apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: InstruqtCourse
metadata:
  name: ai-agents-workshop-v4
spec:
  source:
    repo: https://github.com/temporal-community/ai-agents-workshop-v4
    branch: main
    path: instruqt

  images:
    workshop:
      container: workshop
      context:
        source: source
        path: .
      dockerfile:
        source: source
        path: instruqt/docker/Dockerfile
      platform: linux/amd64

  track:
    organization: temporal
    slug: temporal-ai-agents-python-v4

  catalog:
    title: AI Agents Workshop
    summary: Learn how Temporal makes Python AI agents reliable, recoverable, and observable.
    tags: [AI, Agents, Workshop]
    temporalSdks: [Python]
    resources:
      - label: Workshop source
        url: https://github.com/temporal-community/ai-agents-workshop-v4
        kind: repository
