apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: InstruqtCourse
metadata:
  name: ai-agents-workshop-v4
spec:
  source:
    repo: https://github.com/temporal-community/ai-agents-workshop-v4
    branch: main
    path: instruqt

  images:
    workshop:
      container: workshop
      context:
        source: source
        path: .
      dockerfile:
        source: source
        path: instruqt/docker/Dockerfile
      platform: linux/amd64

  track:
    organization: temporal
    slug: temporal-ai-agents-python-v4

  catalog:
    title: Build AI Agents That Survive Failure
    summary: Make OpenAI Agents SDK agents durable with Temporal, add human approval with Signals, orchestrate specialist agents with child Workflows and Nexus, then call a Java Spring AI agent from Python across a Nexus boundary.
    tags: [AI Agents, Human-in-the-Loop, Multi-Agent, Nexus]
    temporalSdks: [Python, Java]
    aiSdks: [OpenAI Agents SDK, Spring AI]
    duration:
      minHours: 1
      maxHours: 3
    links:
      slideDeck:
        url: https://docs.google.com/presentation/d/19cvHVC-nuBBLlkn4IZr8UIqmQ8nxkO-W-i3wv68gI_k/edit
      runbook:
        url: https://docs.google.com/document/d/180aI7629_bzRbkJTQtmvfq3YpHdygey0f9dUsawfobE/edit
        label: TA runbook and breakout question bank
      externalRecording:
        url: https://youtu.be/QjVpE6-G18U
        label: Agentic AI Summit 2026 session
    resources:
      - label: Workshop source
        url: https://github.com/temporal-community/ai-agents-workshop-v4
        kind: repository
