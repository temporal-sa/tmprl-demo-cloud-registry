apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: InstruqtCourse
metadata:
  name: ai-agents-webinar
spec:
  source:
    repo: https://github.com/temporal-sa/ai-agents-webinar
    branch: main
    path: instruqt

  images:
    workshop:
      container: workshop
      context:
        source: source
        path: .
      dockerfile:
        source: source
        path: instruqt/docker/Dockerfile
      platform: linux/amd64

  track:
    organization: temporal
    slug: ai-agents-webinar

  catalog:
    title: Durable AI Agents Webinar
    summary: Build an AI agent loop as a Temporal Workflow, pause it for human input with Signals and Queries, then hand work to specialist agents with child Workflows and Nexus. Three 30-minute Python modules using OpenAI and the OpenAI Agents SDK.
    tags: [AI, Agents, Human-in-the-loop, Multi-agent, Nexus, Webinar]
    temporalSdks: [Python]
    aiSdks: [OpenAI Agents SDK]
    duration:
      minHours: 1
      maxHours: 1.5
    resources:
      - label: Workshop source
        url: https://github.com/temporal-sa/ai-agents-webinar
        kind: repository
