apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: InstruqtCourse
metadata:
  name: ai-agents-webinar
spec:
  source:
    repo: https://github.com/temporal-sa/ai-agents-webinar
    branch: main
    path: instruqt

  images:
    workshop:
      container: workshop
      context:
        source: source
        path: .
      dockerfile:
        source: source
        path: instruqt/docker/Dockerfile
      platform: linux/amd64

  track:
    organization: temporal
    slug: ai-agents-webinar

  catalog:
    title: Durable AI Agents Webinar
    summary: Build an AI agent loop as a Temporal Workflow, pause it for human input with Signals and Queries, then hand work to specialist agents with child Workflows and Nexus. Three 30-minute Python modules using OpenAI and the OpenAI Agents SDK.
    tags: [AI Agents, Human-in-the-Loop, Multi-Agent, Nexus, Webinar]
    temporalSdks: [Python]
    aiSdks: [OpenAI Agents SDK]
    duration:
      minHours: 1
      maxHours: 1.5
    links:
      slideDeck:
        url: https://docs.google.com/presentation/d/1clb2-Xf1TtHzdUeYtnzOggHwrCfV2X8Eu0ph2k2JzeM/edit
      runbook:
        url: https://docs.google.com/document/d/180aI7629_bzRbkJTQtmvfq3YpHdygey0f9dUsawfobE/edit
        label: TA runbook and breakout question bank
      externalRecording:
        url: https://temporal-io.zoom.us/rec/share/g6t5_YI9ij86WLIpVYbZCL4pAzm-fFzHmsMSrPJ8VBR5_45lz9UmILqDplglndLm.1a6eZp2Eg7ejJFOM
        label: Aug 12, 2026 session (Zoom, passcode required)
    resources:
      - label: Workshop source
        url: https://github.com/temporal-sa/ai-agents-webinar
        kind: repository
