apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: InstruqtCourse
metadata:
  name: patching-and-recovery-workshop
spec:
  source:
    repo: https://github.com/temporal-sa/temporal-workshop-patching-and-recovery
    path: instruqt

  images:
    workstation:
      container: workstation
      context:
        source: source
        path: .
      dockerfile:
        source: source
        path: instruqt/Dockerfile

  track:
    organization: temporal
    slug: patching-and-recovery-workshop

  catalog:
    title: Versioning & Recovery on Temporal
    summary: "Break hundreds of running Workflows with a non-determinism error, then heal them by redeploying. Then work through the Patching API, safe vs. unsafe changes, Workflow-type cutovers, and Worker Deployment Versioning: Pinned vs. Auto-Upgrade, ramping, and draining with Continue-As-New."
    tags: [Worker Versioning, Patching, Recovery]
    temporalSdks: [Python]
    duration:
      minHours: 3
      maxHours: 4
    resources:
      - label: Workshop source
        url: https://github.com/temporal-sa/temporal-workshop-patching-and-recovery
        kind: repository
