apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: InstruqtCourse
metadata:
  name: durable-ad-campaign-typescript-workshop
spec:
  source:
    repo: https://github.com/temporal-sa/instruqt-workshop-ad-agency-101
    branch: main
    path: tracks/typescript/instruqt

  images:
    workstation:
      container: workstation
      context:
        source: source
        path: .
      dockerfile:
        source: source
        path: tracks/typescript/instruqt/Dockerfile
      platform: linux/amd64

  track:
    organization: temporal
    slug: durable-ad-campaign-typescript-workshop

  catalog:
    parent: durable-ad-campaign
    variant: TypeScript
    title: "Intro to Temporal: Durable Ad Campaign"
    summary: "Watch a plain script lose CatNip Cola's ad campaign mid-launch, then rebuild it as a durable Temporal app with Workflows, Activities, retries, and typed errors. The finale kills the Worker mid-launch and the campaign still finishes. Bonus challenges cover human-in-the-loop and Temporal Cloud."
    tags: [Durable execution, Getting started, Retries, Error handling]
    temporalSdks: [TypeScript]
    duration:
      minHours: 1
      maxHours: 1.5
    resources:
      - label: Workshop source
        url: https://github.com/temporal-sa/instruqt-workshop-ad-agency-101
        kind: repository
