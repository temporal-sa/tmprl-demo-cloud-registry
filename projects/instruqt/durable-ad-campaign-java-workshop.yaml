apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: InstruqtCourse
metadata:
  name: durable-ad-campaign-java-workshop
spec:
  source:
    repo: https://github.com/temporal-sa/instruqt-workshop-ad-agency-101
    branch: main
    path: tracks/java/instruqt

  images:
    workstation:
      container: workstation
      context:
        source: source
        path: .
      dockerfile:
        source: source
        path: tracks/java/instruqt/Dockerfile
      platform: linux/amd64

  track:
    organization: temporal
    slug: durable-ad-campaign-java-workshop

  catalog:
    parent: durable-ad-campaign
    variant: Java
    title: Hands on Temporal Introduction
    summary: Build a durable advertising campaign application with Temporal.
    tags: [Durable execution, Workshop]
    temporalSdks: [Java]
    resources:
      - label: Workshop source
        url: https://github.com/temporal-sa/instruqt-workshop-ad-agency-101
        kind: repository
