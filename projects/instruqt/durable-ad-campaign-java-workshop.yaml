apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: InstruqtCourse
metadata:
  name: durable-ad-campaign-java-workshop
spec:
  source:
    repo: https://github.com/temporal-sa/instruqt-workshop-ad-agency-101
    branch: main
    path: tracks/java/instruqt

  images:
    workstation:
      container: workstation
      context:
        source: source
        path: .
      dockerfile:
        source: source
        path: tracks/java/instruqt/Dockerfile
      platform: linux/amd64

  track:
    organization: temporal
    slug: durable-ad-campaign-java-workshop

  catalog:
    parent: durable-ad-campaign
    variant: Java
    title: "Intro to Temporal: Durable Ad Campaign"
    summary: "Watch a plain script lose CatNip Cola's ad campaign mid-launch, then rebuild it as a durable Temporal app with Workflows, Activities, retries, and typed errors. The finale kills the Worker mid-launch and the campaign still finishes. Bonus challenges cover human-in-the-loop and Temporal Cloud."
    tags: [Durable execution, Getting started, Retries, Error handling]
    temporalSdks: [Java]
    duration:
      minHours: 1
      maxHours: 1.5
    links:
      slideDeck:
        url: https://docs.google.com/presentation/d/1wCWVkuSei-OXPWHci1epYXw0qiBljLKvJ7zbNQcym3c/edit
      speakerNotes:
        url: https://docs.google.com/presentation/d/1rehj4C5UgTmnrMnaU8vnG--PN_a-utDHldrZHSDQkEM/edit
        label: Deck with presenter notes
      externalRecording:
        url: https://www.youtube.com/watch?v=tZRtLbKXtqg
        label: Sep 16, 2026 session (Python track)
    resources:
      - label: Workshop source
        url: https://github.com/temporal-sa/instruqt-workshop-ad-agency-101
        kind: repository
