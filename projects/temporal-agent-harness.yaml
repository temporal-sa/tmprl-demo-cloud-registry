metadata:
  name: temporal-agent-harness

registry:
  title: Temporal Agent Harness
  summary: Multi-agent chat and tool orchestration demo showing durable agent execution, streaming progress, human approvals, and managed demo workspaces.
  tags:
    - Agents
    - Durable Execution
    - Human-in-the-Loop
    - Streaming
    - Tool Calling
    - Demo Workspaces
  temporalSdks:
    - Python

source:
  repo: https://github.com/temporal-sa/temporal-agent-harness-example
  branch: main

builds:
  app:
    context: .
    dockerfile: simple_chat_agent/Dockerfile

components:
  web:
    build: app
    command: ["uvicorn", "simple_chat_agent.frontend.server:app", "--host", "0.0.0.0", "--port", "8080", "--proxy-headers", "--forwarded-allow-ips", "*"]
    ports:
      - name: http
        containerPort: 8080
        servicePort: 80

  api:
    build: app
    temporalAccess: true
    secrets:
      - anthropic-credentials
    command: ["uvicorn", "simple_chat_agent.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    ports:
      - name: http
        containerPort: 8000
        servicePort: 80
    env:
      - name: SIMPLE_CHAT_TASK_QUEUE
        value: simple-chat-agent-testing
      - name: SIMPLE_CHAT_WORKFLOW_PREFIX
        value: testing-
      - name: SIMPLE_CHAT_DEMO_WORKSPACES_ENABLED
        value: "0"

  worker:
    build: app
    secrets:
      - anthropic-credentials
    command: ["python", "-m", "simple_chat_agent.worker.main"]
    worker:
      taskQueue: simple-chat-agent-testing
      versioning:
        enabled: true
        env:
          enabled: SIMPLE_CHAT_WORKER_VERSIONING_ENABLED
          buildId: SIMPLE_CHAT_WORKER_VERSION
          deploymentName: SIMPLE_CHAT_WORKER_DEPLOYMENT_NAME
    ports:
      - name: codec
        containerPort: 8001
        servicePort: 80
    env:
      - name: SIMPLE_CHAT_STREAM_SINK_URL
        value: http://api:80
      - name: SIMPLE_CHAT_TASK_QUEUE
        value: simple-chat-agent-testing
      - name: SIMPLE_CHAT_WORKFLOW_PREFIX
        value: testing-

ingress:
  subdomain: agent-harness-demo.testing
  routes:
    - pathPrefix: /api
      component: api
      port: http
    - pathPrefix: /oauth
      component: api
      port: http
    - pathPrefix: /internal
      component: api
      port: http
    - component: web
      port: http
