apiVersion: platform.temporal.io/v1alpha1
kind: ProjectDeployment
metadata:
  name: temporal-agent-harness
spec:
  namespace: temporal-agent-harness
  environment: testing

  source:
    repo: https://github.com/temporal-sa/temporal-agent-harness-example
    branch: main
    context: .
    dockerfile: simple_chat_agent/Dockerfile

  image:
    repositoryName: temporal-michaelj-agent-harness-demo
    tagStrategy: git-sha

  runtime:
    services:
      - name: web
        containerPort: 8080
        servicePort: 80
      - name: api
        containerPort: 8000
        servicePort: 80
      - name: worker
        containerPort: 8001
        servicePort: 80
        worker: true

  ingress:
    subdomain: agent-harness-demo.testing
    target:
      service: web
      port: 80

  temporal:
    createNamespace: true
    namespaceId: temporal-agent-harness-testing
    endpoint:
      env: TEMPORAL_HOST
      valueFrom:
        temporalNamespaceEndpoint: true
    namespace:
      env: TEMPORAL_NAMESPACE
    apiKey:
      env: TEMPORAL_API_KEY

  workerController:
    enabled: true
    workers:
      - name: worker
        service: worker
        taskQueue: simple-chat-agent-testing

  env:
    - name: SIMPLE_CHAT_PUBLIC_URL
      valueFrom:
        ingressUrl: true
