apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: DemoProject
metadata:
  name: expense-approval
spec:
  registry:
    title: Expense Approval
    summary: >-
      Built with Go and a web UI driven from Workflow Event History.
      Demonstrates Signals for approver decisions, durable timers for escalation
      and expiry, and Retry Policies for a flaky payment provider. Use case:
      expense approvals that wait through worker outages.
    tags: [Human-in-the-Loop, Signals, Durable Timers, Retries]
    temporalSdks: [Go]
    links:
      slideDeck:
        url: https://docs.google.com/presentation/d/1VfARW2aSPiy5RUNQtNSg2Ppyk5tUafjcw9z126sKL-A
      runbook:
        label: Runbook
        url: https://github.com/temporal-sa/temporal-demo-expense-approval/blob/main/RUNBOOK.md
    crashable:
      enabled: true
      taskQueueEnv: TEMPORAL_TASK_QUEUE
      baseTaskQueue: expense-approval
  source:
    repo: https://github.com/temporal-sa/temporal-demo-expense-approval
  builds:
    app:
      context: .
      dockerfile: Dockerfile
  components:
    web:
      build: app
      ports:
        - containerPort: 8080
          servicePort: 80
      temporalAccess: true
    worker:
      build: app
      command:
        - /app/worker
      worker: true
      autoscaling:
        taskQueue: expense-approval
  ingress:
    subdomain: expense-approvals
  smokeCheck:
    path: /healthz
    expectedStatus: 200
