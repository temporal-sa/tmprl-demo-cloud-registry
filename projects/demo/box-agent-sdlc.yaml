# Copy only this file into tmprl-demo-cloud-registry/projects/demo/box-agent-sdlc.yaml.
# The registry builds images, injects secrets, and manages HTTPS rollouts.
apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: DemoProject
metadata:
  name: box-agent-sdlc
spec:
  registry:
    title: Agentic SDLC — PostgreSQL
    summary: >-
      A separate Python and Pydantic AI SDLC application with PostgreSQL-backed
      checkpoints, leases, approvals, timers and recovery. Compare the same
      GitHub delivery scenarios with the Temporal application; model calls and
      external effects retain explicit retry and reconciliation boundaries.
    tags: [AI Agents, Multi-Agent, Human-in-the-Loop, Databases, Recovery]
    aiSdks: [Pydantic AI]
    links:
      runbook:
        label: Deployment and recovery guide
        url: https://github.com/temporal-sa/box-agent-sdlc/blob/main/docs/deployment.md
  source:
    repo: https://github.com/temporal-sa/box-agent-sdlc
    branch: main
  builds:
    app:
      context: .
      dockerfile: docker/app.Dockerfile
    executor:
      context: .
      dockerfile: docker/executor.Dockerfile
  secrets:
    runtime:
      requiredProperties: [DATABASE_URL, GITHUB_WEBHOOK_SECRET, EXECUTOR_TOKEN, GITHUB_COMMAND_ACTORS]
    github:
      requiredProperties: [GITHUB_TOKEN]
    anthropic:
      shared: anthropic
      requiredProperties: [ANTHROPIC_API_KEY]
    openai:
      shared: openai
      requiredProperties: [OPENAI_API_KEY]
    gemini:
      shared: gemini
      requiredProperties: [GEMINI_API_KEY]
  components:
    web:
      build: app
      replicas: 1
      command: [/bin/sh, -ec]
      args: ["python -m box_agent_sdlc.migrate; exec uvicorn box_agent_sdlc.web:app --host 0.0.0.0 --port 8000"]
      ports: [{name: http, containerPort: 8000, servicePort: 80}]
      env:
        - {name: APP_SCOPE, value: box-agent-sdlc}
        - {name: AUTH_MODE, value: proxy}
        - {name: DEMO_MODE, value: live}
        - {name: PUBLIC_URL, value: "https://box-agent-sdlc.tmprl-demo.cloud"}
        - {name: GITHUB_SANDBOX_REPO, value: temporal-sa/box-agent-sdlc-storefront}
        - name: DATABASE_URL
          valueFrom: {inputRef: secrets.runtime.DATABASE_URL}
        - name: GITHUB_WEBHOOK_SECRET
          valueFrom: {inputRef: secrets.runtime.GITHUB_WEBHOOK_SECRET}
        - name: GITHUB_COMMAND_ACTORS
          valueFrom: {inputRef: secrets.runtime.GITHUB_COMMAND_ACTORS}
    runner-v1:
      build: app
      replicas: 1
      terminationGracePeriodSeconds: 120
      command: [/bin/sh, -ec]
      args: ["python -m box_agent_sdlc.migrate; exec python -m box_agent_sdlc.runner"]
      env:
        - {name: APP_SCOPE, value: box-agent-sdlc}
        - {name: AUTH_MODE, value: proxy}
        - {name: DEMO_MODE, value: live}
        - {name: PIPELINE_VERSION, value: v1}
        - {name: PUBLIC_URL, value: "https://box-agent-sdlc.tmprl-demo.cloud"}
        - {name: GITHUB_SANDBOX_REPO, value: temporal-sa/box-agent-sdlc-storefront}
        - {name: EXECUTOR_URL, value: "http://executor:8082"}
        - {name: RUN_BUDGET_USD, value: "3.00"}
        - name: DATABASE_URL
          valueFrom: {inputRef: secrets.runtime.DATABASE_URL}
        - name: GITHUB_WEBHOOK_SECRET
          valueFrom: {inputRef: secrets.runtime.GITHUB_WEBHOOK_SECRET}
        - name: GITHUB_COMMAND_ACTORS
          valueFrom: {inputRef: secrets.runtime.GITHUB_COMMAND_ACTORS}
        - name: EXECUTOR_TOKEN
          valueFrom: {inputRef: secrets.runtime.EXECUTOR_TOKEN}
        - name: GITHUB_TOKEN
          valueFrom: {inputRef: secrets.github.GITHUB_TOKEN}
        - name: ANTHROPIC_API_KEY
          valueFrom: {inputRef: secrets.anthropic.ANTHROPIC_API_KEY}
        - name: OPENAI_API_KEY
          valueFrom: {inputRef: secrets.openai.OPENAI_API_KEY}
        - name: GOOGLE_API_KEY
          valueFrom: {inputRef: secrets.gemini.GEMINI_API_KEY}
    runner-v2:
      build: app
      replicas: 1
      terminationGracePeriodSeconds: 120
      command: [/bin/sh, -ec]
      args: ["python -m box_agent_sdlc.migrate; exec python -m box_agent_sdlc.runner"]
      env:
        - {name: APP_SCOPE, value: box-agent-sdlc}
        - {name: AUTH_MODE, value: proxy}
        - {name: DEMO_MODE, value: live}
        - {name: PIPELINE_VERSION, value: v2}
        - {name: PUBLIC_URL, value: "https://box-agent-sdlc.tmprl-demo.cloud"}
        - {name: GITHUB_SANDBOX_REPO, value: temporal-sa/box-agent-sdlc-storefront}
        - {name: EXECUTOR_URL, value: "http://executor:8082"}
        - {name: RUN_BUDGET_USD, value: "3.00"}
        - name: DATABASE_URL
          valueFrom: {inputRef: secrets.runtime.DATABASE_URL}
        - name: GITHUB_WEBHOOK_SECRET
          valueFrom: {inputRef: secrets.runtime.GITHUB_WEBHOOK_SECRET}
        - name: GITHUB_COMMAND_ACTORS
          valueFrom: {inputRef: secrets.runtime.GITHUB_COMMAND_ACTORS}
        - name: EXECUTOR_TOKEN
          valueFrom: {inputRef: secrets.runtime.EXECUTOR_TOKEN}
        - name: GITHUB_TOKEN
          valueFrom: {inputRef: secrets.github.GITHUB_TOKEN}
        - name: ANTHROPIC_API_KEY
          valueFrom: {inputRef: secrets.anthropic.ANTHROPIC_API_KEY}
        - name: OPENAI_API_KEY
          valueFrom: {inputRef: secrets.openai.OPENAI_API_KEY}
        - name: GOOGLE_API_KEY
          valueFrom: {inputRef: secrets.gemini.GEMINI_API_KEY}
    executor:
      build: executor
      isolatedExecutor: true
      replicas: 1
      ports: [{name: http, containerPort: 8082, servicePort: 8082}]
      env:
        - {name: EXECUTOR_SANDBOX, value: bubblewrap}
        - {name: EXECUTOR_PORT, value: "8082"}
        - name: EXECUTOR_TOKEN
          valueFrom: {inputRef: secrets.runtime.EXECUTOR_TOKEN}
  ingress:
    subdomain: box-agent-sdlc
    temporalAuthRequired: true
    routes:
      - {pathPrefix: /webhooks/github, component: web, port: http, public: true}
      - {pathPrefix: /, component: web, port: http}
  smokeCheck:
    path: /readyz
    expectedStatus: 200
    timeoutSeconds: 15
