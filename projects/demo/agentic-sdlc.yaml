# DemoProject for the tmprl-demo.cloud registry; the registry's copy is
# projects/demo/agentic-sdlc.yaml. Keep the two in step.
# Validate from the registry repo:  python3 scripts/validate_projects.py
apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: DemoProject
metadata:
  name: agentic-sdlc
spec:
  registry:
    title: Agentic SDLC
    summary: >-
      Built with Python, Pydantic AI and Temporal's agent harness over Anthropic,
      OpenAI and Gemini. Demonstrates parallel coding agents as child Workflows,
      human approval gates, budget limits, a canary with automatic rollback, and
      Worker Versioning. Use case: a GitHub issue taken to production by AI agents.
    tags: [AI Agents, Multi-Agent, Human-in-the-Loop]
    temporalSdks: [Python]
    aiSdks: [Pydantic AI]
    crashable:
      enabled: true
      taskQueueEnv: TEMPORAL_TASK_QUEUE
      baseTaskQueue: agentic-sdlc
    links:
      slideDeck:
        label: Agentic SDLC deck
        url: https://docs.google.com/presentation/d/1EetmG7GZ3IYJQlmwinZzJipw3z5K4FaHxvBXcC-t1FM/edit
      runbook:
        label: Agentic SDLC runbook
        url: https://github.com/temporal-sa/temporal-demo-agentic-sdlc/blob/main/RUNBOOK.md
  source:
    repo: https://github.com/temporal-sa/temporal-demo-agentic-sdlc
  builds:
    app:
      context: .
      dockerfile: docker/app.Dockerfile
    redis:
      context: .
      dockerfile: docker/redis.Dockerfile
  secrets:
    anthropic:
      shared: anthropic
      requiredProperties: [ANTHROPIC_API_KEY]
    openai:
      shared: openai
      requiredProperties: [OPENAI_API_KEY]
    gemini:
      shared: gemini
      requiredProperties: [GEMINI_API_KEY]
    # Fine-grained PAT scoped to temporal-sa/agentic-sdlc-storefront (contents, pull requests,
    # issues: read/write). Expires 2027-10-22; see RUNBOOK "Rotate the GitHub token".
    github:
      requiredProperties: [GITHUB_TOKEN]
    runtime:
      requiredProperties: [REDIS_PASSWORD, SESSION_SECRET]
  components:
    web:
      build: app
      command: [uvicorn, agentic_sdlc.web.app:app, --host, 0.0.0.0, --port, "8000"]
      temporalAccess: true
      replicas: 1
      ports: [{name: http, containerPort: 8000, servicePort: 80}]
      env:
        - {name: TEMPORAL_TASK_QUEUE, value: agentic-sdlc}
        - {name: TRUST_AUTH_HEADERS, value: "true"}
        # The web server holds no LLM keys; this is the list its model pickers offer.
        - {name: ENABLED_PROVIDERS, value: "anthropic,openai,google"}
        - name: REDIS_PASSWORD
          valueFrom: {inputRef: secrets.runtime.REDIS_PASSWORD}
        - {name: REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"}
        - name: SESSION_SECRET
          valueFrom: {inputRef: secrets.runtime.SESSION_SECRET}
        - {name: GITHUB_SANDBOX_REPO, value: temporal-sa/agentic-sdlc-storefront}
    # One worker per pipeline version, both always running, as in the pizza Worker Versioning
    # demo. They are plain workers (crashable, autoscaled) rather than platform-versioned
    # components: the app registers the versions itself and the console makes one current
    # (agentic_sdlc/versions.py), so a presenter can roll out v2 mid-run without a redeploy.
    # The Worker Deployment is named <task queue>-pipeline, so a crashable workspace gets its own.
    worker-v1:
      build: app
      command: [python, -m, agentic_sdlc.worker]
      worker: true
      # An in-flight model call can run for minutes; let it finish on shutdown.
      terminationGracePeriodSeconds: 600
      secrets: [anthropic, openai, gemini, github]
      env:
        - {name: TEMPORAL_TASK_QUEUE, value: agentic-sdlc}
        - {name: TEMPORAL_WORKER_BUILD_ID, value: v1}
        - {name: PIPELINE_VERSION, value: v1}
        - name: REDIS_PASSWORD
          valueFrom: {inputRef: secrets.runtime.REDIS_PASSWORD}
        - {name: REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"}
        - {name: WEB_INTERNAL_URL, value: "http://web"}
        - {name: GITHUB_SANDBOX_REPO, value: temporal-sa/agentic-sdlc-storefront}
        - {name: RUN_BUDGET_USD, value: "3.00"}
    worker-v2:
      build: app
      command: [python, -m, agentic_sdlc.worker]
      worker: true
      # An in-flight model call can run for minutes; let it finish on shutdown.
      terminationGracePeriodSeconds: 600
      secrets: [anthropic, openai, gemini, github]
      env:
        - {name: TEMPORAL_TASK_QUEUE, value: agentic-sdlc}
        - {name: TEMPORAL_WORKER_BUILD_ID, value: v2}
        - {name: PIPELINE_VERSION, value: v2}
        - name: REDIS_PASSWORD
          valueFrom: {inputRef: secrets.runtime.REDIS_PASSWORD}
        - {name: REDIS_URL, value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"}
        - {name: WEB_INTERNAL_URL, value: "http://web"}
        - {name: GITHUB_SANDBOX_REPO, value: temporal-sa/agentic-sdlc-storefront}
        - {name: RUN_BUDGET_USD, value: "3.00"}
    redis:
      build: redis
      command: [sh, -c]
      args: ['exec redis-server --save "" --appendonly no --requirepass "$REDIS_PASSWORD"']
      ports: [{containerPort: 6379}]
      env:
        - name: REDIS_PASSWORD
          valueFrom: {inputRef: secrets.runtime.REDIS_PASSWORD}
  ingress:
    subdomain: agentic-sdlc
    temporalAuthRequired: true
    component: web
    port: http
  smokeCheck:
    path: /healthz
    expectedStatus: 200
    timeoutSeconds: 15
