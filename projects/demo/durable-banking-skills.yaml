apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: DemoProject
metadata:
  name: durable-banking-skills
spec:
  source:
    repo: https://github.com/temporal-sa/durable-claude-skills
  builds:
    # Worker + agent API in ONE image so they share the local SQLite ledger
    # (banking.db). The Dockerfile's CMD runs both entrypoints; the worker moves
    # money and the API only reports what the worker actually did.
    app:
      context: .
      dockerfile: docker/combined.Dockerfile
    # Static Vite UI built with Node, served by nginx. Context is the repo root
    # (the Dockerfile prefixes paths with web/).
  components:
    app:
      build: app
      worker: true
      temporalProxy:
        enabled: true # code only knows plaintext localhost:7233
      replicas: 1 # sing
      ports:
        - name: http
          containerPort: 8080
          servicePort: 80
      env:
        - name: ANTHROPIC_API_KEY
          valueFrom:
            inputRef: secrets.anthropic.ANTHROPIC_API_KEY
        # BANK_DB_PATH defaults to /data/banking.db in the image (writable,
        # ephemeral; re-seeds on boot) — no override needed.
        - name: ALLOWED_ORIGINS
          value: https://durable-banking-skills.tmprl-demo.cloud
        - name: VITE_TEMPORAL_UI
          value: https://cloud.temporal.io
        - name: VITE_TEMPORAL_NAMESPACE
          value: tmprl-dem-cld-durable-banking-skills.a2dd6
  secrets:
    anthropic:
      shared: anthropic
      requiredProperties:
        - ANTHROPIC_API_KEY
  ingress:
    subdomain: durable-banking-skills
    routes:
      - pathPrefix: /
        component: app
        port: http
  registry:
    title: Durable Banking Skills
    summary: A Claude agent chats about money transfers while a deterministic Temporal workflow moves the money — plan, a human approval gate, and a withdraw/deposit saga that refunds on failure.
    tags: [AI, Agents, Banking, Workflows]
    temporalSdks: [Python]
    readiness:
      score: 4
      maxScore: 5
      note: Worker and API share an ephemeral SQLite ledger in one pod; re-seeds on start.
