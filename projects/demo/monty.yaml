apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: DemoProject
metadata:
  name: monty
spec:
  registry:
    title: Temporal Agent Harness (Monty)
    summary: >-
      Conversational travel agents run sandboxed Python with durable Temporal
      activities, human approvals, subagents, and an observable trip board.
    canonical: true
    tags: [AI, AI - Agents, Human-in-the-Loop]
    temporalSdks: [Python]
    links:
      slideDeck:
        label: Temporal Harness Pitch Deck
        url: https://docs.google.com/presentation/d/1MdyLY2HI6U4i1crhIpxTqQIExmjMA18p8yyTzzl6La4
      externalRecording:
        label: Agent harness demo
        url: https://drive.google.com/file/d/1HEwsBnabhiszNh0ULDwCcnAavfNzDcLK/view
      additional:
        - label: Agent harness intro (15 min)
          url: https://drive.google.com/file/d/1BD5KHuNLzAXSSVeTFzGiap2CXgnkRUCd/view
          audience: technical
      runbook:
        label: Monty README
        url: https://github.com/temporal-community/temporal-agent-harness/tree/d594d1ba01f56769959960d586a712e717ca706a/examples/monty

  source:
    # Displayed in the catalog. Builds and source watches use gitRepository.url,
    # which holds the deployment adapter.
    repo: https://github.com/temporal-community/temporal-agent-harness
    gitRepository:
      url: https://github.com/temporal-sa/tmprl-demo-cloud-registry
      sparseCheckout:
        - deployments/monty

  builds:
    app:
      context: deployments/monty
      dockerfile: deployments/monty/Dockerfile

  secrets:
    gemini:
      shared: gemini
      requiredProperties: [GEMINI_API_KEY]

  components:
    web:
      build: app
      args: [web]
      temporalAccess: true
      replicas: 1
      awsIamRoleArn: arn:aws:iam::429214323166:role/tmprl-dem-cld-monty-payloads
      env:
        - name: MONTY_PAYLOAD_BUCKET
          value: tmprl-dem-cld-monty-payloads-429214323166-us-west-1
        - name: AWS_DEFAULT_REGION
          value: us-west-1
      ports:
        - name: http
          containerPort: 8000
          servicePort: 80
    worker:
      build: app
      args: [worker]
      worker:
        versioning:
          enabled: true
          deploymentName: monty
      # Scale-to-zero canary for versioned (PINNED) workers. The queue is
      # TASK_QUEUE in temporal-agent-harness examples/monty/workflow.py.
      autoscaling:
        taskQueue: monty-dynamic-agent
      awsIamRoleArn: arn:aws:iam::429214323166:role/tmprl-dem-cld-monty-payloads
      secrets: [gemini]
      env:
        - name: MONTY_PAYLOAD_BUCKET
          value: tmprl-dem-cld-monty-payloads-429214323166-us-west-1
        - name: AWS_DEFAULT_REGION
          value: us-west-1

  ingress:
    subdomain: monty
    temporalAuthRequired: true
    component: web
    port: http

  smokeCheck:
    path: /api/agents
    expectedStatus: 200
    timeoutSeconds: 15
