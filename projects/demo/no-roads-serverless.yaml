# Serverless Workers demo (temporal-demo-serverless-no-roads): a Go web UI/API on
# Kubernetes that starts DemoWorkflows, plus a Temporal worker running on AWS
# Lambda. Because the project has a serverless (AWS Lambda) worker, the operator
# defaults its Temporal Cloud namespace region to the AWS region
# (aws-ca-central-1) so Temporal's Lambda compute provider can reach the worker.
apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: DemoProject
metadata:
  name: no-roads-serverless
spec:
  registry:
    title: No Roads Serverless
    summary: >-
      Audience members submit a name and watch Temporal scale Lambda workers
      against task-queue backlog, concurrency, and sync match rate.
    # Opt-in. The application reads TEMPORAL_TASK_QUEUE, claims the Worker
    # Deployment from TEMPORAL_WORKER_DEPLOYMENT_NAME / TEMPORAL_WORKER_BUILD_ID,
    # and appends the active queue to workflow IDs. Unset, those stay
    # serverless-webinar / 1.0.0 for the shared demo.
    isolatedLambda:
      enabled: true
      taskQueueEnv: TEMPORAL_TASK_QUEUE
      baseTaskQueue: serverless-webinar
  source:
    repo: https://github.com/temporal-sa/temporal-demo-serverless-no-roads
  temporal:
    auth:
      mode: apiKey
  builds:
    app:
      context: .
      dockerfile: demo-app/Dockerfile
    worker:
      context: .
      dockerfile: lambda-worker/Dockerfile
  components:
    # Web UI + API (Go HTTP server). Serves the audience UI at / and the
    # /api/submit, /api/seed, /api/metrics endpoints on the same port, and needs
    # a Temporal client to start workflows and read metrics.
    app:
      build: app
      ports:
        - name: http
          containerPort: 8080
          servicePort: 80
      temporalAccess: true
    # Temporal worker on AWS Lambda. The always-on function keeps Worker
    # Deployment serverless-webinar / 1.0.0 (fixed buildId). An isolated
    # workspace reuses this image and suffixes the deployment name.
    worker:
      build: worker
      serverless:
        provider: aws-lambda
        packageType: image
        architecture: x86_64
        memoryMb: 512
        timeoutSeconds: 600
        workerDeployment:
          deploymentName: serverless-webinar
          buildId: "1.0.0"
  ingress:
    subdomain: no-roads-serverless
    temporalAuthRequired: true
    routes:
      - pathPrefix: /
        component: app
        port: http
  smokeCheck:
    expectedStatus: 200
    path: /
