apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: DemoProject
metadata:
  name: visual-workflows
spec:
  registry:
    title: Visual Workflows
    summary: >-
      Built with Go and a browser-based flow builder where every drawn flow runs
      as a Workflow. Demonstrates retry policies, Signals and Updates, timers,
      sagas, Schedules, and Worker Versioning, plus a Claude agent step. Use
      case: a no-code builder for durable business processes.
    tags: [Worker Versioning, Saga, Signals, Human-in-the-Loop, AI Agents]
    temporalSdks: [Go]
    aiSdks: [Anthropic SDK]
    links:
      runbook:
        label: Runbook
        url: https://github.com/temporal-sa/temporal-demo-visual-workflows/blob/main/RUNBOOK.md
    crashable:
      enabled: true
      taskQueueEnv: TASK_QUEUE
      baseTaskQueue: visual-workflows
  source:
    repo: https://github.com/temporal-sa/temporal-demo-visual-workflows
  builds:
    app:
      context: .
      dockerfile: docker/app.Dockerfile
    sandbox:
      context: .
      dockerfile: docker/sandbox.Dockerfile
    worker:
      context: .
      dockerfile: docker/worker.Dockerfile
  secrets:
    anthropic:
      shared: anthropic
      requiredProperties:
        - ANTHROPIC_API_KEY
    session:
      requiredProperties:
        - SESSION_SECRET
  components:
    app:
      build: app
      ports:
        - name: http
          containerPort: 8080
          servicePort: 80
      env:
        - name: TASK_QUEUE
          value: visual-workflows
        - name: WORKER_MODE
          value: long-lived
        - name: SANDBOX_URL
          value: http://sandbox:8090
        - name: CALLBACK_BASE_URL
          value: http://app
        - name: TEMPORAL_UI_URL
          value: https://cloud.temporal.io
        - name: TRUST_AUTH_HEADERS
          value: 'true'
        - name: SESSION_SECRET
          valueFrom:
            inputRef: secrets.session.SESSION_SECRET
      temporalAccess: true
    sandbox:
      build: sandbox
      ports:
        - containerPort: 8090
          servicePort: 8090
    worker:
      build: worker
      env:
        - name: TASK_QUEUE
          value: visual-workflows
        - name: ANTHROPIC_API_KEY
          valueFrom:
            inputRef: secrets.anthropic.ANTHROPIC_API_KEY
      worker:
        versioning:
          enabled: true
      autoscaling:
        taskQueue: visual-workflows
  ingress:
    subdomain: visual-workflows
    temporalAuthRequired: true
  smokeCheck:
    path: /healthz
    expectedStatus: 200
    timeoutSeconds: 10
