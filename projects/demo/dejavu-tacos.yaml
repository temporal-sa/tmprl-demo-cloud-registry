apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: DemoProject
metadata:
  name: dejavu-tacos
spec:
  registry:
    title: Deja Vu Tacos
    summary: >-
      Built with Python, Go, TypeScript, Java, and .NET workers behind a phone-
      style ordering app. Demonstrates Saga compensation, Retries, and Signals,
      compared against direct service calls. Use case: order management that
      keeps working through a store outage.
    tags: [Food Service, Order Management, Saga, Retries, Signals]
    temporalSdks: [Python, Go, TypeScript, Java, .NET]
    links:
      slideDeck:
        url: https://drive.google.com/file/d/1Kk_1i6Dbd_pkqqg4sApXyDUIAYYwIB2B/view
      runbook:
        label: Runbook
        url: https://github.com/temporal-sa/temporal-demo-dejavu-tacos/blob/main/RUNBOOK.md
    crashable:
      enabled: true
      taskQueueEnv: TEMPORAL_TASK_QUEUE
      baseTaskQueue: dejavu-tacos

  source:
    repo: https://github.com/temporal-sa/temporal-demo-dejavu-tacos
    # branch defaults to main

  builds:
    frontend:
      context: .
      dockerfile: docker/frontend.Dockerfile
    backend:
      context: .
      dockerfile: docker/backend.Dockerfile
    worker-python:
      context: .
      dockerfile: docker/worker-python.Dockerfile

  components:
    # nginx serves the UI and proxies /api -> backend; servicePort 80 makes this
    # the public catch-all (single unnamed port becomes "http").
    frontend:
      build: frontend
      ports:
        - containerPort: 5173
          servicePort: 80

    # Starts workflows and sends signals, so it needs Temporal credentials.
    backend:
      build: backend
      temporalAccess: true
      env:
        - name: DEJAVU_WORKER_LANGUAGE
          value: python
      ports:
        - containerPort: 8000
          servicePort: 8000

    # Temporal worker; polls TEMPORAL_TASK_QUEUE (default dejavu-tacos).
    worker:
      build: worker-python
      worker: true
      env:
        - name: DEJAVU_BACKEND_URL
          value: http://backend:8000

  ingress:
    subdomain: dejavu-tacos
    temporalAuthRequired: false
    # routes default to a catch-all at the servicePort-80 component (frontend)

  # Smoke /api/health routes through the frontend nginx proxy to the backend.
  smokeCheck:
    path: /api/health
    expectedStatus: 200
