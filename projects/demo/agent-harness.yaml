apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: DemoProject
metadata:
  name: agent-harness
spec:
  registry:
    title: Temporal Agent Harness (Travel Agent)
    summary: >-
      Built with Python on the Temporal Agent Harness, Gemini through Google
      GenAI, and a pydantic-monty sandbox. Demonstrates each tool call as a
      durable Activity, approval cards, and crash recovery mid-booking. Use
      case: a travel agent that books trips with human approval.
    tags: [AI Agents, Human-in-the-Loop, Travel]
    temporalSdks: [Python]
    aiSdks: [Google GenAI SDK]
    canonical: true
    links:
      slideDeck:
        label: Temporal Harness Pitch Deck
        url: https://docs.google.com/presentation/d/1MdyLY2HI6U4i1crhIpxTqQIExmjMA18p8yyTzzl6La4
      externalRecording:
        label: Temporal Agent Harness explainer
        url: https://github.com/user-attachments/assets/18a34eb2-fc6d-446d-9507-7fe4c870492f
      additional:
        - label: Agent harness intro (15 min)
          url: https://drive.google.com/file/d/1BD5KHuNLzAXSSVeTFzGiap2CXgnkRUCd/view
          audience: technical
      runbook:
        label: Runbook
        url: https://github.com/temporal-sa/temporal-demo-agent-harness/blob/main/RUNBOOK.md
    crashable:
      enabled: true
      taskQueueEnv: TEMPORAL_TASK_QUEUE
      baseTaskQueue: agent-harness

  source:
    repo: https://github.com/temporal-sa/temporal-demo-agent-harness

  builds:
    app:
      context: .
      dockerfile: Dockerfile

  secrets:
    gemini:
      shared: gemini
      requiredProperties: [GEMINI_API_KEY]

  components:
    web:
      build: app
      args: [web]
      temporalAccess: true
      awsIamRoleArn: arn:aws:iam::429214323166:role/tmprl-dem-cld-monty-payloads
      env:
        # Read the signed-in user from the catalog's forward-auth headers.
        - name: TRUST_AUTH_HEADERS
          value: "true"
        - name: PAYLOAD_BUCKET
          value: tmprl-dem-cld-monty-payloads-429214323166-us-west-1
        - name: AWS_DEFAULT_REGION
          value: us-west-1
      ports:
        - name: http
          containerPort: 8000
          servicePort: 80
    worker:
      build: app
      args: [worker]
      worker:
        versioning:
          enabled: true
          deploymentName: agent-harness
      # Scale-to-zero canary for versioned (PINNED) workers.
      autoscaling:
        taskQueue: agent-harness
      awsIamRoleArn: arn:aws:iam::429214323166:role/tmprl-dem-cld-monty-payloads
      secrets: [gemini]
      env:
        - name: PAYLOAD_BUCKET
          value: tmprl-dem-cld-monty-payloads-429214323166-us-west-1
        - name: AWS_DEFAULT_REGION
          value: us-west-1

  ingress:
    subdomain: agent-harness
    temporalAuthRequired: true
    component: web
    port: http

  smokeCheck:
    path: /api/health
    expectedStatus: 200
    timeoutSeconds: 15
