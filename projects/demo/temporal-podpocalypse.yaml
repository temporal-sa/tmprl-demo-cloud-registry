apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: DemoProject
metadata:
  name: podpocalypse
spec:
  source:
    repo: https://github.com/temporal-sa/temporal-demo-podpocalypse
    branch: main
  registry:
    title: Podpocalypse
    summary: >-
      Built with Go, Nexus, and a Kubernetes pod-ship game for a KubeCon booth.
      Demonstrates an Entity Workflow per flight, Nexus calls, and replay after
      the worker is deleted. Use case: a live booth game that shows what
      Temporal recovers after a crash.
    tags: [Entity Workflows, Nexus, Games]
    temporalSdks: [Go]
    links:
      runbook:
        label: Runbook
        url: https://github.com/temporal-sa/temporal-demo-podpocalypse/blob/main/RUNBOOK.md
  builds:
    app:
      context: .
      dockerfile: Dockerfile
  temporal:
    auth:
      mode: apiKey
  components:
    booth:
      build: app
      worker: true
      temporalAccess: true
      env:
        - name: RUNTIME
          value: process
        - name: PUBLIC_URL
          value: https://podpocalypse.tmprl-demo.cloud
        - name: AUTH_VERIFY_URL
          value: http://web.tmprl-dem-cld-registry-operator.svc.cluster.local/_auth/verify
        - name: EVENT_LEADS_URL
          value: https://event-leads.tmprl-demo.cloud
        - name: EVENT_LEADS_ENDPOINT
          value: event-leads-participants
        - name: CONTROL_TASK_QUEUE
          value: podpocalypse-control
      ports:
        - name: http
          containerPort: 8080
          servicePort: 80
  ingress:
    subdomain: podpocalypse
    temporalAuthRequired: false
    component: booth
    port: http
  smokeCheck:
    path: /healthz
    expectedStatus: 200
