apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: DemoProject
metadata:
  name: canonical-ai-demo
spec:
  registry:
    title: Travel Planner Agent
    summary: >-
      Built with Python and no agent framework: a hand-written ReAct loop
      calling Anthropic or OpenAI models. Demonstrates LLM and tool calls as
      Activities, a parallel web-research fan-out, and human confirmation via
      Signal. Use case: planning and booking a multi-city trip.
    tags: [AI Agents, Human-in-the-Loop, Travel]
    temporalSdks: [Python]
    aiSdks: [Anthropic SDK, OpenAI SDK]
    canonical: true
    crashable:
      enabled: true
      taskQueueEnv: TEMPORAL_TASK_QUEUE
      baseTaskQueue: travel-agent
    links:
      speakerNotes:
        url: https://docs.google.com/document/d/1sPlLnnrNiIiJCAI4jE5NCVRCA4QuOnApOmePm55xapM/edit?tab=t.0
      slideDeck:
        url: https://docs.google.com/presentation/d/1R3aryBIwW-BTxD7TJZfb5ApcC9aI0CXgTgaN3jbX-nk/edit?slide=id.g3ef69db33e0_0_2173#slide=id.g3ef69db33e0_0_2173
      runbook:
        label: Runbook
        url: https://github.com/temporal-sa/canonical-ai-demo/blob/main/RUNBOOK.md
      goldenPath:
        url: https://drive.google.com/file/d/1kpHgn9OTlB9nUdqz2_OBjtOuUZnUkubV/view?usp=drive_link
  source:
    repo: https://github.com/temporal-sa/canonical-ai-demo

  builds:
    app:
      context: .
      dockerfile: docker/app.Dockerfile
    worker:
      context: .
      dockerfile: docker/worker.Dockerfile
    postgres:
      context: .
      dockerfile: docker/postgres.Dockerfile

  components:
    postgres:
      build: postgres
      replicas: 1
      ports:
        - name: db
          containerPort: 5432
          servicePort: 5432
      env:
        - name: POSTGRES_USER
          valueFrom:
            inputRef: secrets.db-creds.POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            inputRef: secrets.db-creds.POSTGRES_PASSWORD

    worker:
      build: worker
      worker: true
      secrets:
        - anthropic
      env:
        - name: LLM_PROVIDER
          value: anthropic
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: travel
        - name: DB_USER
          valueFrom:
            inputRef: secrets.db-creds.POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            inputRef: secrets.db-creds.POSTGRES_PASSWORD

    app:
      build: app
      temporalAccess: true
      env:
        # Cloud deploy: the Demo-controls drawer hides the `make` commands and
        # shows a "Crash workers" button that proxies to the catalog's
        # crashable-workspace controller. Unset (local) keeps the make commands.
        - name: DEMO_HOSTING
          value: cloud
      ports:
        - name: http
          containerPort: 8000
          servicePort: 80

  secrets:
    anthropic:
      shared: anthropic
      requiredProperties:
        - ANTHROPIC_API_KEY
    db-creds:
      requiredProperties:
        - POSTGRES_USER
        - POSTGRES_PASSWORD

  ingress:
    subdomain: canonical-ai-demo
    temporalAuthRequired: true
    component: app
    port: http
