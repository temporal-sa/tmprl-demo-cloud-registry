apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: DemoProject
metadata:
  name: canonical-ai-demo
spec:
  registry:
    title: Travel Planner Agent
    summary: >-
      The canonical 101-level agentic demo. A single-agent ReAct loop on Temporal 
      that plans a real multi-city trip. LLM and tools as activities, a durable parallel web-research fan-out, 
      human-in-the-loop booking via signal, crash-recoverable and replay-safe.
    canonical: true
    links:
      speakerNotes:
        url: https://docs.google.com/document/d/1sPlLnnrNiIiJCAI4jE5NCVRCA4QuOnApOmePm55xapM/edit?tab=t.0
      slideDeck:
        url: https://docs.google.com/presentation/d/1R3aryBIwW-BTxD7TJZfb5ApcC9aI0CXgTgaN3jbX-nk/edit?slide=id.g3ef69db33e0_0_2173#slide=id.g3ef69db33e0_0_2173
      runbook:
        url: https://github.com/temporal-sa/canonical-ai-demo/tree/main#quick-start
      goldenPathRecording:
        url: https://drive.google.com/file/d/1dA44RxONlAU9cCNNMhmaZl0_1cBXiUne/view?usp=drive_link
    tags: [AI, AI - Agents, Single-Agent]
    temporalSdks: [Python]
  source:
    repo: https://github.com/temporal-sa/canonical-ai-demo

  builds:
    app:
      context: .
      dockerfile: docker/app.Dockerfile
    worker:
      context: .
      dockerfile: docker/worker.Dockerfile
    postgres:
      context: .
      dockerfile: docker/postgres.Dockerfile

  components:
    postgres:
      build: postgres
      replicas: 1
      ports:
        - name: db
          containerPort: 5432
          servicePort: 5432
      env:
        - name: POSTGRES_USER
          valueFrom:
            inputRef: secrets.db-creds.POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            inputRef: secrets.db-creds.POSTGRES_PASSWORD

    worker:
      build: worker
      worker: true
      secrets:
        - anthropic-credentials
      env:
        - name: LLM_PROVIDER
          value: anthropic
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: travel
        - name: DB_USER
          valueFrom:
            inputRef: secrets.db-creds.POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            inputRef: secrets.db-creds.POSTGRES_PASSWORD

    app:
      build: app
      temporalAccess: true
      ports:
        - name: http
          containerPort: 8000
          servicePort: 80

  secrets:
    anthropic-credentials:
      requiredProperties:
        - ANTHROPIC_API_KEY
    db-creds:
      requiredProperties:
        - POSTGRES_USER
        - POSTGRES_PASSWORD

  ingress:
    subdomain: canonical-ai-demo
    temporalAuthRequired: true
    component: app
    port: http
