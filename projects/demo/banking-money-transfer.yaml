apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: DemoProject
metadata:
  name: banking-money-transfer
spec:
  registry:
    title: Banking Money Transfer
    summary: >-
      Built with Python and JavaScript: a banking-app UI, an API, and a Temporal
      worker running the transfer saga. Demonstrates a money-transfer saga with
      compensation and failure scenarios, with optional payload encryption. Use
      case: moving money reliably through failures.
    tags: [Banking, Saga]
    temporalSdks: [Python]
    links:
      slideDeck:
        label: "Intro to Temporal: Money Transfer"
        url: https://docs.google.com/presentation/d/1UtFAJvgJuvtxy07REUmFISvlmXzvC97Y49Wu_yNK57c
      runbook:
        label: Runbook
        url: https://github.com/temporal-sa/temporal-demo-banking-app-money-transfer/blob/main/RUNBOOK.md
    crashable:
      enabled: true
      taskQueueEnv: TEMPORAL_TASK_QUEUE
      baseTaskQueue: MoneyTransfer

  source:
    repo: https://github.com/temporal-sa/temporal-demo-banking-app-money-transfer
    # branch defaults to main

  builds:
    frontend:
      context: .
      dockerfile: docker/frontend.Dockerfile
    backend:
      context: .
      dockerfile: docker/backend.Dockerfile
    worker:
      context: .
      dockerfile: docker/worker-python.Dockerfile

  components:
    # nginx serves the UI and proxies /api -> backend; servicePort 80 makes this
    # the public catch-all (single unnamed port becomes "http").
    frontend:
      build: frontend
      ports:
        - containerPort: 5173
          servicePort: 80

    # Starts/queries workflows, so it needs Temporal credentials injected.
    backend:
      build: backend
      temporalAccess: true
      ports:
        - containerPort: 8000
          servicePort: 8000

    # Temporal worker. The worker and backend both default to the MoneyTransfer
    # task queue; crashable workspaces inject TEMPORAL_TASK_QUEUE into both.
    worker:
      build: worker
      worker: true
      env:
        - name: BANKING_BACKEND_URL
          value: http://backend:8000

  ingress:
    subdomain: banking-app
    temporalAuthRequired: false
    # routes default to a catch-all at the servicePort-80 component (frontend)

  # Smoke /api/health routes through the frontend nginx proxy to the backend.
  smokeCheck:
    path: /api/health
    expectedStatus: 200
