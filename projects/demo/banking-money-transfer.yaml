apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: DemoProject
metadata:
  name: banking-money-transfer
spec:
  registry:
    title: Banking Money Transfer
    summary: Durable money-transfer banking demo — a web UI and API backed by a Temporal worker running the money-transfer saga.
    tags:
      - Banking
      - Workflows
      - Saga
    temporalSdks:
      - Python

  source:
    repo: https://github.com/temporal-sa/demo-banking-app-money-transfer
    # branch defaults to main

  builds:
    frontend:
      context: .
      dockerfile: docker/frontend.Dockerfile
    backend:
      context: .
      dockerfile: docker/backend.Dockerfile
    worker:
      context: .
      dockerfile: docker/worker-lambda.Dockerfile

  components:
    # nginx serves the UI and proxies /api -> backend; servicePort 80 makes this
    # the public catch-all (single unnamed port becomes "http").
    frontend:
      build: frontend
      ports:
        - containerPort: 5173
          servicePort: 80

    # Starts/queries workflows, so it needs Temporal credentials injected.
    backend:
      build: backend
      temporalAccess: true
      ports:
        - name: http
          containerPort: 8000
          servicePort: 8000

      # Temporal worker; uses the app's default task queue (MoneyTransfer), which
      # the backend also defaults to, so they match without injecting one.
    worker:
      build: worker
      env:
        - name: BANKING_BACKEND_URL
          value: https://banking-app.tmprl-demo.cloud
      serverless:
        provider: aws-lambda
        packageType: image
        architecture: x86_64
        memoryMb: 512
        timeoutSeconds: 600
        workerDeployment:
          deploymentName: money-transfer

  ingress:
    subdomain: banking-app
    temporalAuthRequired: false
    routes:
      - pathPrefix: /api
        component: backend
        port: http
      - pathPrefix: /
        component: frontend
        port: http

  # Smoke /api/health routes through the frontend nginx proxy to the backend.
  smokeCheck:
    path: /api/health
    expectedStatus: 200
