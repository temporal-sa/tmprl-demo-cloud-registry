apiVersion: registry.tmprl-demo.cloud/v1alpha1
kind: DemoProject
metadata:
  name: registry-operator
  annotations:
    registry.tmprl-demo.cloud/catalog: "true"
    registry.tmprl-demo.cloud/finalization-policy: retain
spec:
  registry:
    title: Demo Cloud Registry
    summary: Landing page for Temporal demo projects, reconciled from reviewed project configs and backed by platform workflows for demo environment management.
    tags:
      - Registry
      - Platform
      - Demo Management
      - Temporal Cloud
    temporalSdks:
      - Python
      - Go

  source:
    repo: https://github.com/temporal-sa/tmprl-demo-cloud-registry
    gitRepository:
      url: ssh://git@github.com/temporal-sa/tmprl-demo-cloud-registry.git
      authSecret: source-auth
      ignore: |
        /*
        !/registry/
        /registry/*
        !/registry/web/
        !/registry/web/**
        !/registry/worker/
        !/registry/worker/**
        !/registry/temporal-cloud-proxy/
        !/registry/temporal-cloud-proxy/**
    # branch defaults to main

  builds:
    web:
      context: .
      dockerfile: registry/web/Dockerfile
    worker:
      context: .
      dockerfile: registry/worker/Dockerfile
    temporal-cloud-proxy:
      context: .
      dockerfile: registry/temporal-cloud-proxy/Dockerfile

  secrets:
    temporal-cloud-bootstrap: {}

  components:
    web:
      build: web
      env:
        - name: AUTH_MODE
          value: google
      # single unnamed port -> name "http"; servicePort 80 -> public catch-all
      ports:
        - containerPort: 8080
          servicePort: 80

    registry-operator:
      build: worker
      automountServiceAccountToken: true
      secrets:
        - temporal-cloud-bootstrap
      env:
        - name: DEMO_REGISTRY_TASK_QUEUE
          value: registry-management
        - name: DEMO_REGISTRY_EXTERNAL_RESOURCE_MODE
          value: aws
        - name: DEMO_REGISTRY_TEMPORAL_CLOUD_MODE
          value: cloud-api
        - name: DEMO_REGISTRY_TEMPORAL_CLOUD_BOOTSTRAP_SECRET_PATH
          value: tmprl-dem-cld/registry-operator/temporal-cloud-bootstrap
        - name: DEMO_REGISTRY_BUILD_MODE
          value: aws-codebuild
        - name: DEMO_REGISTRY_CODEBUILD_PROJECT
          value: tmprl-dem-cld-build
        - name: DEMO_REGISTRY_CODEBUILD_POLL_SECONDS
          value: "30"
        - name: DEMO_REGISTRY_CODEBUILD_TIMEOUT_MINUTES
          value: "30"
        - name: DEMO_REGISTRY_AWS_REGION
          value: us-west-1
        - name: DEMO_REGISTRY_AWS_ACCOUNT_ID
          value: "429214323166"
        - name: DEMO_REGISTRY_TEMPORAL_CLOUD_ACCOUNT_ID
          value: a2dd6
        - name: DEMO_REGISTRY_TEMPORAL_CLOUD_REGION
          value: gcp-us-central1
        - name: DEMO_REGISTRY_READINESS_TIMEOUT_SECONDS
          value: "300"
        - name: DEMO_REGISTRY_READINESS_POLL_SECONDS
          value: "5"
        - name: DEMO_REGISTRY_CATALOG_STATUS_NAMESPACE
          value: tmprl-dem-cld-registry-operator
        - name: DEMO_REGISTRY_CATALOG_STATUS_CONFIGMAP
          value: registry-catalog-status
        - name: DEMO_REGISTRY_CATALOG_STATUS_MIRROR_NAMESPACE
          value: tmprl-dem-cld-registry-operator
        - name: DEMO_REGISTRY_SOURCE_WATCH_NAMESPACE
          value: tmprl-dem-cld-registry-operator
        - name: DEMO_REGISTRY_SOURCE_WATCH_INTERVAL
          value: 1m
        - name: DEMO_REGISTRY_ACTIVITY_WORKERS
          value: "20"
        - name: DEMO_REGISTRY_WORKER_ENABLED
          value: "true"
        - name: DEMO_REGISTRY_WATCH_ENABLED
          value: auto
      worker:
        versioning:
          enabled: true
          taskQueue: registry-operator
          rollout:
            strategy: AllAtOnce
            gate:
              workflowType: RegistryOperatorCanaryWorkflow
              input:
                projectNamePrefix: operator-canary
                timeoutSeconds: 1800
                cleanupTimeoutSeconds: 900
                pollSeconds: 10
                cleanupPolicy: Always
                demoProjectTemplate:
                  apiVersion: registry.tmprl-demo.cloud/v1alpha1
                  kind: DemoProject
                  metadata:
                    name: operator-canary-template
                  spec:
                    source:
                      repo: https://github.com/temporal-sa/demo-banking-app-money-transfer
                    builds:
                      frontend:
                        context: .
                        dockerfile: docker/frontend.Dockerfile
                      backend:
                        context: .
                        dockerfile: docker/backend.Dockerfile
                      worker:
                        context: .
                        dockerfile: docker/worker-python.Dockerfile
                    components:
                      frontend:
                        build: frontend
                        ports:
                          - containerPort: 5173
                            servicePort: 80
                      backend:
                        build: backend
                        temporalAccess: true
                        ports:
                          - containerPort: 8000
                            servicePort: 8000
                      worker:
                        build: worker
                        worker: true
                        env:
                          - name: BANKING_BACKEND_URL
                            value: http://backend:8000
                    ingress:
                      subdomain: operator-canary
                      temporalAuthRequired: false
                    smokeCheck:
                      path: /api/health
                      expectedStatus: 200
          sunset:
            scaledownDelay: 1m
            deleteDelay: 5m

  ingress:
    subdomain: catalog
    temporalAuthRequired: true
    # routes default to a catch-all at the servicePort-80 component (web)

  smokeCheck:
    path: /health
    expectedStatus: 200
