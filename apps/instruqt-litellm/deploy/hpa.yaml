apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: instruqt-litellm
  namespace: tmprl-dem-cld-instruqt-litellm
  labels:
    app: instruqt-litellm
    app.kubernetes.io/name: instruqt-litellm
    app.kubernetes.io/component: litellm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: instruqt-litellm
  minReplicas: 5
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
