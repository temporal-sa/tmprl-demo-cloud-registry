apiVersion: v1
kind: Service
metadata:
  name: instruqt-litellm-redis
  namespace: tmprl-dem-cld-instruqt-litellm
  labels:
    app: instruqt-litellm-redis
    app.kubernetes.io/name: instruqt-litellm
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    app: instruqt-litellm-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: instruqt-litellm-redis
  namespace: tmprl-dem-cld-instruqt-litellm
  labels:
    app: instruqt-litellm-redis
    app.kubernetes.io/name: instruqt-litellm
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: instruqt-litellm-redis
  template:
    metadata:
      labels:
        app: instruqt-litellm-redis
        app.kubernetes.io/name: instruqt-litellm
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
