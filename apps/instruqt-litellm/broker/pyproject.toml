[project]
name = "instruqt-litellm-broker"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.34",
  "cryptography>=42",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.7",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
