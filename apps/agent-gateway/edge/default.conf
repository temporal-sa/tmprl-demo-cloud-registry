# The single public entry point for the hosted demo.
#
# It exists because of one platform fact: the demo cloud platform gives a project
# exactly one hostname, and its Traefik routes match `PathPrefix` without
# stripping it. Both of the things we host under a prefix -- code-server and the
# Google ADK dev UI -- need the prefix taken off before they see the request. So
# the project takes a single catch-all route to this container, and the path
# fan-out happens here, where `location` matching is longest-prefix-wins and the
# trailing slash on `proxy_pass` is a documented stripping mechanism.
#
# Upstreams are Kubernetes Service names, resolved by nginx at startup. If a
# Service is not yet created when this pod starts, nginx exits and Kubernetes
# restarts it; the platform gates promotion on readiness, so that costs a few
# seconds and nothing else.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8080;
  server_name _;

  # The approval dashboard posts justifications and rejection reasons.
  client_max_body_size 32m;

  # Emit relative Location headers on the redirects below. nginx would otherwise
  # build an absolute URL from $scheme://$host:$server_port, and $server_port is
  # the port nginx LISTENS on (8080), not the one the client used -- so
  # `return 302 /ide/` on the public host produced
  # http://agent-gateway.tmprl-demo.cloud:8080/ide/: plaintext, and a port
  # nothing serves.
  absolute_redirect off;

  proxy_http_version 1.1;
  # Host is load-bearing, not hygiene: the MCP server's DNS-rebinding guard
  # matches this header against GATEWAY_MCP_ALLOWED_HOSTS and answers 421 on a
  # miss.
  #
  # $http_host, not $host, and the difference is the whole bug. $host drops the
  # port, and the guard's "name:*" wildcard matches by prefixing "name:" -- so a
  # bare `localhost` does not match `localhost:*`, and every /mcp call through a
  # non-default port fails with "Invalid Host header". $http_host forwards the
  # Host exactly as the client sent it, which keeps the port when there is one
  # and matches the bare public hostname when there is not.
  proxy_set_header Host              $http_host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        $connection_upgrade;

  # ------------------------------------------------------------------ the IDE
  #
  # code-server has no base-path option (coder/code-server#1987) and emits
  # relative assets and relative redirects, so it works behind a proxy that
  # strips -- the trailing slash on proxy_pass below is what strips.
  #
  # The bare-/ide redirect is mandatory rather than a nicety. Without the
  # trailing slash the browser resolves code-server's own "./login" against /,
  # which lands on the approver dashboard's login page instead. Two different
  # login screens on one host is exactly the confusion to avoid on stage.
  location = /ide { return 302 /ide/$is_args$args; }
  location /ide/ {
    proxy_pass http://ide:8080/;

    # EVERY header the server block sets has to be repeated here, and that is
    # not redundancy -- it is nginx's inheritance rule. proxy_set_header is
    # inherited from the enclosing level ONLY when the current level declares
    # none of its own. The moment this block sets Accept-Encoding (which
    # code-server's reverse-proxy guide requires), it drops Host, the
    # X-Forwarded-* set, Upgrade and Connection.
    #
    # Losing Upgrade is what breaks the editor: the workbench loads over plain
    # HTTP, then its WebSocket to /ide/stable-<commit> arrives at code-server as
    # an ordinary GET and is answered 404. The browser reports that as an
    # abnormal close, "WebSocket close with status code 1006", and the session
    # never attaches -- a blank editor with a reload dialog.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # $http_host here, not $host -- the same port question as the Host header
    # above, for a second reason. code-server checks a WebSocket's Origin
    # against X-Forwarded-Host when that header is present, falling back to Host
    # otherwise. $host drops the port, so a browser on :8081 sends
    # "Origin: http://localhost:8081", code-server compares it to "localhost",
    # and answers 403 -- a rejected upgrade that surfaces as the same 1006 the
    # missing Upgrade header caused. Invisible on the public host, where 443 is
    # implicit and both forms agree; fatal for local development.
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Accept-Encoding   gzip;

    # The editor holds a WebSocket open for the life of the session.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # -------------------------------------------------------------- ADK dev UI
  #
  # `adk web --url_prefix /adk` makes the Angular app call /adk/* and points the
  # root redirect at /adk/dev-ui/, but it does NOT move the server's own routes:
  # they stay at /, /dev-ui/, /list-apps, /run_live. In other words --url_prefix
  # assumes a stripping proxy, and this is that proxy. The dev UI ships
  # <base href="./">, so assets resolve correctly once stripped.
  location = /adk { return 302 /adk/; }
  location /adk/ {
    proxy_pass http://adk-web:8000/;
    # /run_sse streams and /run_live is a WebSocket; buffering would hold a
    # turn's tokens back until the response completed.
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # ------------------------------------------------------------------ the MCP
  #
  # Prefix PRESERVED: FastMCP mounts the server at /mcp, so there is nothing to
  # strip. No trailing slash on proxy_pass is what preserves it.
  #
  # In the hosted demo the MCP client is the IDE pod, which reaches the gateway
  # directly over cluster DNS and never comes through here. This route exists so
  # an operator can still drive the demo from outside, and because a 404 on /mcp
  # would be a confusing thing to discover mid-demo.
  location /mcp {
    proxy_pass http://gateway:8080;
    # Streamable HTTP is server-sent events, and an approval pause is open-ended.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # ------------------------------------------------------- approver dashboard
  #
  # Stays at the root and cannot move: its forms and fetches are root-absolute
  # (/approve, /reject, /mandate, /scan-mode, /fleet, /login, /logout), and so is
  # /healthz, which the platform's smoke check probes before promoting a
  # candidate. This route is what makes that probe exercise edge->gateway wiring
  # rather than just nginx being alive.
  location / {
    proxy_pass http://gateway:8080;
    # The fleet panel polls /fleet every two seconds and animates the result.
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}
