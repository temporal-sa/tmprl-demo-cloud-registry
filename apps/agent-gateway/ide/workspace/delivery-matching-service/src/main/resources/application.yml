service:
  name: delivery-matching-service
  version: 2.3.1

grpc:
  port: 8291

metrics:
  prometheus:
    port: 9102

matching:
  candidate_radius_meters: 4000
  max_candidates: 64
  scoring:
    weight_distance: 0.45
    weight_eta: 0.30
    weight_load: 0.15
    weight_acceptance: 0.10
  batching:
    enabled: true
    max_batch_size: 3
    max_pickup_spread_meters: 250
