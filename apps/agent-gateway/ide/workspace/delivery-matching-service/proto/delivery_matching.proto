syntax = "proto3";

package quickmeals.delivery.matching.v1;

option java_package = "com.quickmeals.delivery.matching.proto";
option java_multiple_files = true;

// Matches open deliveries to eligible Dashers.
service DeliveryMatching {
  // Return the best match or a batched offer for a single delivery.
  rpc Match(DeliveryRequest) returns (MatchDecision);

  // Stream match decisions for a region as deliveries open.
  rpc MatchStream(MatchStreamRequest) returns (stream MatchDecision);
}

message GeoPoint {
  double lat = 1;
  double lng = 2;
}

message DeliveryRequest {
  string delivery_id = 1;
  string region_id = 2;
  GeoPoint pickup = 3;
  GeoPoint dropoff = 4;
  int32 prep_time_seconds = 5;
  double order_value_usd = 6;
}

message MatchStreamRequest {
  string region_id = 1;
}

message MatchDecision {
  string delivery_id = 1;
  string dasher_id = 2;
  double score = 3;
  int32 projected_eta_seconds = 4;
  bool batched = 5;
  repeated string batched_delivery_ids = 6;
}
